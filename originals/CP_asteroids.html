    "'": [[2,6],[6,10],"FONT_LAST"],
    "?": [[0,8],[4,12],[8,8],[4,4],"FONT_UP",[4,1],[4,0],"FONT_LAST"],
    " ": ["FONT_LAST"]
  };

  function drawVectorChar(ch, x, y, size) {
    const pts = VECTOR_FONT[ch];
    if (!pts) return;
    let penUp = true;
    ctx.beginPath();
    for (const pt of pts) {
      if (pt === 'FONT_LAST') break;
      if (pt === 'FONT_UP') { penUp = true; continue; }
      const sx = x + pt[0] * size;
      const sy = y - pt[1] * size; // font is y-up internally; canvas is y-down
      if (penUp) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      penUp = false;
    }
    ctx.stroke();
  }

  // align: 'left' | 'center' | 'right'. Glyphs are 8 units wide on a 12-unit
  // advance (matching the original font's built-in letter spacing).
  function drawVectorText(str, x, y, size, opts) {
    opts = opts || {};
    const color = opts.color || '#fff';
    const align = opts.align || 'left';
    str = String(str).toUpperCase();
    const charWidth = 12 * size;
    const totalWidth = str.length * charWidth;
    let startX = x;
    if (align === 'center') startX = x - totalWidth / 2;
    else if (align === 'right') startX = x - totalWidth;

    ctx.save();
    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = (opts.glow !== undefined ? opts.glow : 6) * UI_SCALE * GLOW_SCALE;
    ctx.lineWidth = (opts.lineWidth || 2) * UI_SCALE;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let i = 0; i < str.length; i++) {
      drawVectorChar(str[i], startX + i * charWidth, y, size);
    }
    ctx.restore();
  }

  function drawStars() {
    for (const s of stars) {
      const twinkle = 0.5 + 0.5 * Math.sin(s.phase);
      const alpha = s.baseAlpha * (0.4 + 0.6 * twinkle);
      ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
  }

  // Each streak lives at a fixed radial position (it doesn't travel) - it
  // snaps to full length almost instantly, holds briefly, then contracts
  // back to a point while fading, matching the classic lightspeed-jump look.
  // Fully independent of the background starfield, which never moves here.
  function spawnWarpStreaks(intensity) {
    warpSpawnAccumulator += intensity * WARP_SPAWN_RATE;
    while (warpSpawnAccumulator >= 1) {
      warpSpawnAccumulator -= 1;
      const angle = rand(0, TWO_PI);
      const outerDist = rand(WARP_OUTER_MIN, WARP_OUTER_MAX);
      const maxLength = Math.min(rand(100, 320), outerDist - WARP_CENTER_MASK_RADIUS);
      warpStreaks.push({
        angle,
        outerDist,
        maxLength: Math.max(10, maxLength),
        width: rand(1, 2.5),
        baseAlpha: intensity * rand(0.6, 1.0),
        age: 0
      });
    }
  }

  function updateWarpStreaks(intensity) {
    spawnWarpStreaks(intensity);
    for (let i = warpStreaks.length - 1; i >= 0; i--) {
      const s = warpStreaks[i];
      s.age++;
      if (s.age > WARP_STREAK_LIFE) {
        warpStreaks.splice(i, 1);
      }
    }
  }

  function drawWarpStreaks(intensity) {
    if (warpStreaks.length === 0) return;
    ctx.save();
    for (const s of warpStreaks) {
      let lengthFrac;
      if (s.age < WARP_GROW_FRAMES) {
        const gt = s.age / WARP_GROW_FRAMES;
        lengthFrac = 1 - (1 - gt) * (1 - gt); // ease-out: snaps to full length fast
      } else if (s.age < WARP_GROW_FRAMES + WARP_HOLD_FRAMES) {
        lengthFrac = 1;
      } else {
        const st = (s.age - WARP_GROW_FRAMES - WARP_HOLD_FRAMES) / WARP_SHRINK_FRAMES;
        lengthFrac = Math.max(0, 1 - st * st); // ease-in: contracts back to a point
      }

      const headX = WARP_ORIGIN_X + Math.cos(s.angle) * s.outerDist;
      const headY = WARP_ORIGIN_Y + Math.sin(s.angle) * s.outerDist;
      const tailDist = s.outerDist - s.maxLength * lengthFrac;
      const tailX = WARP_ORIGIN_X + Math.cos(s.angle) * tailDist;
      const tailY = WARP_ORIGIN_Y + Math.sin(s.angle) * tailDist;
      const alpha = s.baseAlpha * lengthFrac;
      if (alpha <= 0.01) continue;

      const grad = ctx.createLinearGradient(headX, headY, tailX, tailY);
      grad.addColorStop(0, 'rgba(255,255,255,' + alpha.toFixed(3) + ')');
      grad.addColorStop(1, 'rgba(255,255,255,0)');

      ctx.strokeStyle = grad;
      ctx.lineWidth = s.width;
      ctx.beginPath();
      ctx.moveTo(headX, headY);
      ctx.lineTo(tailX, tailY);
      ctx.stroke();
    }
    ctx.restore();
  }

  const STAR_COUNT = 330;
  let stars = [];
  function buildStars() {
    stars.length = 0;
    for (let i = 0; i < STAR_COUNT; i++) {
      const depth = rand(0.25, 1); // 0.25 = distant/dim/slow, 1 = near/bright/fast
      stars.push({
        x: rand(0, W),
        y: rand(0, H),
        depth: depth,
        size: depth > 0.75 ? 2 : 1,
        baseAlpha: rand(0.25, 0.5) + depth * 0.4,
        phase: rand(0, TWO_PI),
        twinkleSpeed: rand(0.015, 0.05)
      });
    }
  }

  function updateStars() {
    for (const s of stars) {
      s.phase += s.twinkleSpeed;

      // parallax: stars drift opposite the ship's motion, nearer stars drift faster
      if (state === 'playing' && ship) {
        s.x -= ship.vx * s.depth * 0.5;
        s.y -= ship.vy * s.depth * 0.5;
        if (s.x < 0) s.x += W;
        if (s.x > W) s.x -= W;
        if (s.y < 0) s.y += H;
        if (s.y > H) s.y -= H;
      }
    }
  }

  let vignette;
  function rebuildVignette() {
    vignette = ctx.createRadialGradient(
      W/2, H/2, H * 0.35,
      W/2, H/2, H * 0.75
    );
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(0.7, 'rgba(0,0,0,0.55)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.92)');
  }

  function drawVignette() {
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
  }

  function drawPlayAreaBoundary() {
    ctx.save();
    ctx.strokeStyle = 'rgba(150,190,220,0.10)';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, W - 1, H - 1);
    ctx.restore();
  }

  // Faint oscilloscope-style graticule, drawn behind everything else.
  const SCOPE_GRID_SPACING = 80;
  const SCOPE_GRID_COLOR = 'rgba(255,255,255,0.03)';

  // Subtle parallax: the grid drifts a little opposite the ship's position,
  // smoothed so it eases rather than snapping frame to frame.
  const SCOPE_PARALLAX_MAX = 24; // max pixel shift at either extreme
  const SCOPE_PARALLAX_EASE = 0.05;
  let scopeGridOffsetX = 0;
  let scopeGridOffsetY = 0;

  function drawScopeGrid() {
    const targetOffsetX = ship ? ((ship.x - W/2) / (W/2)) * SCOPE_PARALLAX_MAX : 0;
    const targetOffsetY = ship ? ((ship.y - H/2) / (H/2)) * SCOPE_PARALLAX_MAX : 0;
    scopeGridOffsetX += (targetOffsetX - scopeGridOffsetX) * SCOPE_PARALLAX_EASE;
    scopeGridOffsetY += (targetOffsetY - scopeGridOffsetY) * SCOPE_PARALLAX_EASE;

    ctx.save();
    ctx.translate(scopeGridOffsetX, scopeGridOffsetY);
    ctx.lineWidth = 1;
    ctx.strokeStyle = SCOPE_GRID_COLOR;
    ctx.beginPath();
    for (let x = SCOPE_GRID_SPACING; x < W; x += SCOPE_GRID_SPACING) {
      ctx.moveTo(x + 0.5, 0);
      ctx.lineTo(x + 0.5, H);
    }
    for (let y = SCOPE_GRID_SPACING; y < H; y += SCOPE_GRID_SPACING) {
      ctx.moveTo(0, y + 0.5);
      ctx.lineTo(W, y + 0.5);
    }
    ctx.stroke();
    ctx.restore();
  }

  function clampEntitiesToBounds() {
    function rewrap(o) {
      if (!o) return;
      o.x = ((o.x % W) + W) % W;
      o.y = ((o.y % H) + H) % H;
    }
    if (ship) rewrap(ship);
    if (saucer) rewrap(saucer);
    if (asteroids) for (const a of asteroids) rewrap(a);
    if (bullets) for (const b of bullets) rewrap(b);
    if (saucerBullets) for (const b of saucerBullets) rewrap(b);
    if (particles) for (const p of particles) rewrap(p);
    if (trail) for (const p of trail) rewrap(p);
  }

  function drawLifeIcons() {
    const size = 9 * UI_SCALE;
    const spacing = 22 * UI_SCALE;
    const startX = 24 * UI_SCALE + size;
    const y = 66 * UI_SCALE;
    for (let i = 0; i < lives; i++) {
      const x = startX + i * spacing;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-Math.PI / 2);
      ctx.strokeStyle = '#fff';
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 6 * UI_SCALE * GLOW_SCALE;
      ctx.lineWidth = 2 * UI_SCALE;
      ctx.beginPath();
      ctx.moveTo(size, 0);
      ctx.lineTo(-size*0.7, size*0.6);
      ctx.lineTo(-size*0.4, 0);
      ctx.lineTo(-size*0.7, -size*0.6);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawCurrencyHud() {
    const scoreRowY = 34 * UI_SCALE;
    const iconSize = 15 * UI_SCALE;
    const marginRight = 20 * UI_SCALE;
    const iconX = W - marginRight - iconSize;
    const iconY = scoreRowY - iconSize;
    const color = 'rgb(' + PICKUP_COLOR + ')';

    ctx.save();
    ctx.strokeStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 6 * UI_SCALE * GLOW_SCALE;
    ctx.lineWidth = 2 * UI_SCALE;
    ctx.strokeRect(iconX + 0.5, iconY + 0.5, iconSize, iconSize);
    ctx.restore();

    drawVectorText(String(currency).padStart(3, '0'), iconX - 10 * UI_SCALE, scoreRowY, 1.1 * UI_SCALE,
      { align: 'right', color: color, glow: 6 });

  function drawFireHint() {
    if (!USE_FIRE_BUTTON) return;
    if (!isTouchDevice) return;
    if (state !== 'playing' && state !== 'approaching') return;
    const g = fireButtonGeometry();
    const active = dragFireActive;
    ctx.save();
    ctx.strokeStyle = active ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.18)';
    ctx.shadowColor = 'rgba(255,255,255,0.9)';
    ctx.shadowBlur = (active ? 10 : 0) * UI_SCALE * GLOW_SCALE;
    ctx.lineWidth = 2 * UI_SCALE;
    ctx.beginPath();
    ctx.arc(g.cx, g.cy, g.radius, 0, TWO_PI);
    ctx.stroke();
    ctx.restore();
  }

    drawVectorText('SCORE:' + score, 20 * UI_SCALE, 34 * UI_SCALE, 1.3 * UI_SCALE, { glow: 6 });

  let stationShopLine = '';
  function currentPageUpgrades() {
    const start = stationShopPage * SHOP_PAGE_SIZE;
    return UPGRADES.slice(start, start + SHOP_PAGE_SIZE);
  }
  function totalShopPages() {
    return Math.ceil(UPGRADES.length / SHOP_PAGE_SIZE);
  }

  function shopCardRects() {
    const cols = 2, rows = 2;
    const cardW = SHOP_CARD_W * UI_SCALE, cardH = SHOP_CARD_H * UI_SCALE;
    const gapX = SHOP_GAP_X * UI_SCALE, gapY = SHOP_GAP_Y * UI_SCALE;
    const totalW = cols*cardW + (cols-1)*gapX;
    const totalH = rows*cardH + (rows-1)*gapY;
    const leaveGap = 30 * UI_SCALE, leaveH = 46 * UI_SCALE;
    const fullBlockH = totalH + leaveGap + leaveH;
    const startX = W/2 - totalW/2;
    const startY = H/2 - fullBlockH/2;
    const pageItems = currentPageUpgrades();
    const rects = [];
    for (let i = 0; i < pageItems.length; i++) {
      const col = i % cols, row = Math.floor(i / cols);
      rects.push({
        upgrade: pageItems[i],
        x: startX + col*(cardW+gapX),
        y: startY + row*(cardH+gapY),
        w: cardW, h: cardH
      });
    }
    return rects;
  }
  function drawShopArrowTriangle(cx, cy, size, direction) {
    ctx.beginPath();
    if (direction < 0) {
      ctx.moveTo(cx + size*0.4, cy - size*0.55);
      ctx.lineTo(cx - size*0.4, cy);
      ctx.lineTo(cx + size*0.4, cy + size*0.55);
    } else {
      ctx.moveTo(cx - size*0.4, cy - size*0.55);
      ctx.lineTo(cx + size*0.4, cy);
      ctx.lineTo(cx - size*0.4, cy + size*0.55);
    }
    ctx.closePath();
    ctx.stroke();
  }

  function shopGridTopY() {
    const cols = 2, rows = 2;
    const cardH = SHOP_CARD_H * UI_SCALE, gapY = SHOP_GAP_Y * UI_SCALE;
    const totalH = rows*cardH + (rows-1)*gapY;
    const leaveGap = 30 * UI_SCALE, leaveH = 46 * UI_SCALE;
    const fullBlockH = totalH + leaveGap + leaveH;
    return H/2 - fullBlockH/2;
  }
  function shopLeaveRect() {
    const cols = 2, rows = 2;
    const cardH = SHOP_CARD_H * UI_SCALE, gapY = SHOP_GAP_Y * UI_SCALE;
    const totalH = rows*cardH + (rows-1)*gapY;
    const bottomOfGrid = shopGridTopY() + totalH;
    return { x: W/2 - 90*UI_SCALE, y: bottomOfGrid + 30*UI_SCALE, w: 180*UI_SCALE, h: 46*UI_SCALE };
  }
  function shopPageArrowRects() {
    const topY = shopGridTopY();
    const rows = 2;
    const cardH = SHOP_CARD_H * UI_SCALE, gapY = SHOP_GAP_Y * UI_SCALE;
    const gridH = rows*cardH + (rows-1)*gapY;
    const cardW = SHOP_CARD_W * UI_SCALE, gapX = SHOP_GAP_X * UI_SCALE;
    const gridHalfW = (cardW*2 + gapX) / 2;
    const w = Math.min(70 * UI_SCALE, W * 0.12);
    const h = gridH;
    const desiredGap = 40 * UI_SCALE; // stay close to the grid on wide/desktop screens
    const margin = 16 * UI_SCALE;     // but never get pushed off-screen on narrow ones

    let prevX = W/2 - gridHalfW - desiredGap - w;
    let nextX = W/2 + gridHalfW + desiredGap;
    prevX = Math.max(margin, prevX);
    nextX = Math.min(W - margin - w, nextX);

    return {
      prev: { x: prevX, y: topY, w, h },
      next: { x: nextX, y: topY, w, h }
    };
  }

  function drawShopCard(card, index) {
    const u = card.upgrade;
    const cost = upgradeCost(u);
    const affordable = cost !== null && currency >= cost;
    const locked = cost === null;
    const selected = index === stationSelectedCard;

    ctx.save();
    ctx.globalAlpha = stationShopFadeT * (locked ? 0.3 : 1);

    ctx.fillStyle = selected ? 'rgba(150,235,255,0.10)' : 'rgba(255,255,255,0.05)';
    ctx.fillRect(card.x, card.y, card.w, card.h);
    ctx.strokeStyle = selected ? 'rgb(150,235,255)' : (affordable ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.25)');
    ctx.lineWidth = selected ? 3 : 2;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = (selected ? 14 : 0) * GLOW_SCALE;
    ctx.strokeRect(card.x, card.y, card.w, card.h);

    ctx.strokeStyle = '#fff';
    ctx.fillStyle = '#fff';
    ctx.lineWidth = 2 * UI_SCALE;
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 6 * UI_SCALE * GLOW_SCALE;
    u.icon(card.x + card.w/2, card.y + 58*UI_SCALE, 70*UI_SCALE);

    ctx.shadowBlur = 0;
    const nameLabel = u.type === 'stackable' && u.level > 0 ? u.name + ' LV' + u.level : u.name;
    drawVectorText(nameLabel, card.x + card.w/2, card.y + 112*UI_SCALE, 0.85*UI_SCALE, { align: 'center', glow: 3 });
    drawVectorText(u.describe(u), card.x + card.w/2, card.y + 130*UI_SCALE, 0.55*UI_SCALE,
      { align: 'center', color: 'rgba(255,255,255,0.6)' });

    if (locked) {
      let label;
      if (u.type === 'onetime') {
        if (u.owned) label = 'OWNED';
        else if (u.requires && !upgradeIsOwned(u.requires)) label = 'NEEDS ' + findUpgrade(u.requires).name;
        else label = 'OWNED';
      }
      else if (u.level >= u.maxLevel) label = 'MAX LEVEL';
      else label = 'NEXT VISIT';
      drawVectorText(label, card.x + card.w/2, card.y + card.h - 12*UI_SCALE, 0.7*UI_SCALE,
        { align: 'center', color: 'rgb(150,235,255)', glow: 4 });
    } else {
      const label = String(cost);
      const costColor = affordable ? 'rgb(255,225,60)' : 'rgba(255,225,60,0.4)';
      const iconX = card.x + card.w/2 + 18*UI_SCALE;
      drawVectorText(label, iconX - 8*UI_SCALE, card.y + card.h - 10*UI_SCALE, 0.85*UI_SCALE, { align: 'right', color: costColor, glow: 3 });
      ctx.strokeStyle = costColor;
      ctx.lineWidth = 2 * UI_SCALE;
      ctx.strokeRect(iconX, card.y + card.h - 23*UI_SCALE, 13*UI_SCALE, 13*UI_SCALE);
    }
    ctx.restore();
  }

  function drawShopUI() {
    const a = stationShopFadeT;
    if (a <= 0.01) return;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(5,7,12,0.75)';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    drawCurrencyHud(); // same spot/style as normal play - not re-derived

    if (stationShopLine) {
      drawVectorText(stationShopLine, W/2, shopGridTopY() - 62*UI_SCALE, 1.15*UI_SCALE,
        { align: 'center', color: 'rgba(255,255,255,' + a.toFixed(2) + ')', lineWidth: 3, glow: 4 * a });
    }

    const pageItems = currentPageUpgrades();
    shopCardRects().forEach((card, i) => drawShopCard(card, i));

    // page arrows + indicator
    const pages = totalShopPages();
    if (pages > 1) {
      const arrows = shopPageArrowRects();
      const pageItemsForArrows = currentPageUpgrades();
      const prevSelected = stationSelectedCard === pageItemsForArrows.length + 1;
      const nextSelected = stationSelectedCard === pageItemsForArrows.length + 2;
      ctx.save();
      ctx.globalAlpha = a;
      for (const [key, selected] of [['prev', prevSelected], ['next', nextSelected]]) {
        const r = arrows[key];
        ctx.fillStyle = selected ? 'rgba(150,235,255,0.10)' : 'rgba(255,255,255,0.0)';
        if (selected) ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeStyle = selected ? 'rgb(150,235,255)' : 'rgba(255,255,255,0.6)';
        ctx.lineWidth = selected ? 3 : 2;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.shadowBlur = (selected ? 14 : 0) * GLOW_SCALE;
        ctx.strokeRect(r.x, r.y, r.w, r.h);
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.shadowBlur = 0;
      const triSize = Math.min(arrows.prev.w, arrows.prev.h) * 0.5;
      ctx.strokeStyle = prevSelected ? 'rgb(150,235,255)' : 'rgba(255,255,255,0.6)';
      drawShopArrowTriangle(arrows.prev.x + arrows.prev.w/2, arrows.prev.y + arrows.prev.h/2, triSize, -1);
      ctx.strokeStyle = nextSelected ? 'rgb(150,235,255)' : 'rgba(255,255,255,0.6)';
      drawShopArrowTriangle(arrows.next.x + arrows.next.w/2, arrows.next.y + arrows.next.h/2, triSize, 1);
      ctx.restore();
      drawVectorText('PAGE ' + (stationShopPage+1) + '/' + pages, W/2, shopGridTopY() - 14*UI_SCALE, 0.7*UI_SCALE,
        { align: 'center', color: 'rgba(255,255,255,' + (a*0.7).toFixed(2) + ')' });
    }

    const lv = shopLeaveRect();
    const leaveSelected = stationSelectedCard === pageItems.length;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = leaveSelected ? 'rgba(150,235,255,0.10)' : 'rgba(255,255,255,0.08)';
    ctx.fillRect(lv.x, lv.y, lv.w, lv.h);
    ctx.strokeStyle = leaveSelected ? 'rgb(150,235,255)' : 'rgba(255,255,255,0.6)';
    ctx.lineWidth = leaveSelected ? 3 : 2;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = (leaveSelected ? 14 : 0) * GLOW_SCALE;
    ctx.strokeRect(lv.x, lv.y, lv.w, lv.h);
    ctx.restore();
    drawVectorText('LEAVE', lv.x + lv.w/2, lv.y + lv.h/2 + 7*UI_SCALE, 1.2*UI_SCALE,
      { align: 'center', color: 'rgba(255,255,255,' + a.toFixed(2) + ')', glow: 4 * a });

    if (stationShopMessageTimer > 0 && stationShopMessage) {
      const msgAlpha = Math.min(1, stationShopMessageTimer/30) * a;
      drawVectorText(stationShopMessage, W/2, lv.y + lv.h + 40*UI_SCALE, 1*UI_SCALE,
        { align: 'center', color: 'rgba(255,255,255,' + msgAlpha.toFixed(2) + ')' });
    }
  }

  function changeShopPage(delta) {
    const pages = totalShopPages();
    stationShopPage = (stationShopPage + delta + pages) % pages;
    stationSelectedCard = 0;
  }

  function handleShopClick(x, y) {
    if (stationShopFadeT < 0.8) return;
    if (totalShopPages() > 1) {
      const arrows = shopPageArrowRects();
      const p = arrows.prev, n = arrows.next;
      if (x >= p.x && x <= p.x+p.w && y >= p.y && y <= p.y+p.h) { changeShopPage(-1); return; }
      if (x >= n.x && x <= n.x+n.w && y >= n.y && y <= n.y+n.h) { changeShopPage(1); return; }
    }
    const rects = shopCardRects();
    for (let i = 0; i < rects.length; i++) {
      const card = rects[i];
      if (x >= card.x && x <= card.x+card.w && y >= card.y && y <= card.y+card.h) {
        stationSelectedCard = i;
        purchaseUpgrade(card.upgrade);
        return;
      }
    }
    const lv = shopLeaveRect();
    if (x >= lv.x && x <= lv.x+lv.w && y >= lv.y && y <= lv.y+lv.h) {
      stationSelectedCard = currentPageUpgrades().length;
      leaveStationShop();
    }
  }

  function leaveStationShop() {
    station = null;
    dockingResultText = '';

    state = 'levelstart';
    stateTimer = LEVEL_TRANSITION_FRAMES;
    transitionShip = { startX: ship.x, startY: ship.y, startAngle: ship.angle };
    ship.vx = 0;
    ship.vy = 0;
    ship.scale = 1;
    warpIntensity = 0;
    particles = [];
    trail = [];
    levelSpawnedThisTransition = false;
    activeBuff = null;
    warpStreaks = [];
    warpSpawnAccumulator = 3;
    bullets = [];
    saucerBullets = [];
    pickups = [];
    missiles = [];
    pendingStationVisit = false; // startLevel() runs at the normal point in the levelstart sequence
  }

  const INTRO_LOGO_OFFSET_X = -88.264707, INTRO_LOGO_OFFSET_Y = -124.80106;
  const INTRO_LOGO_SRC_WIDTH = 65.702026, INTRO_LOGO_SRC_HEIGHT = 69.048576;

  function drawIntroLogo(cx, cy, targetWidth, alpha) {
    const scale = targetWidth / INTRO_LOGO_SRC_WIDTH;
    const targetHeight = INTRO_LOGO_SRC_HEIGHT * scale;
    ctx.save();
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.translate(cx - targetWidth/2, cy - targetHeight/2);
    ctx.scale(scale, scale);
    ctx.translate(INTRO_LOGO_OFFSET_X, INTRO_LOGO_OFFSET_Y);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 5 * GLOW_SCALE / scale;
    for (const p of INTRO_LOGO_PATHS) ctx.fill(p);
    ctx.restore();
  }

  function drawIntroScreen() {
    drawIntroLogo(W/2, H/2 - 20*UI_SCALE, Math.min(320*UI_SCALE, W*0.7));
    if (blinkOn()) {
      drawVectorText('PRESS ENTER OR TAP TO CONTINUE', W/2, H/2 + 230*UI_SCALE, 1*UI_SCALE,
        { align: 'center', glow: 4 });
    }
  }

  function drawMenuScreen() {
    const cx = W / 2;
    drawVectorText('ASTEROIDS', cx, H/2 - 40*UI_SCALE, 4*UI_SCALE, { align: 'center', glow: 9 });
    drawVectorText('ARROWS ROTATE + THRUST', cx, H/2 + 30*UI_SCALE, 1*UI_SCALE, { align: 'center', glow: 4 });
    drawVectorText('DRAG TO FLY   SHIFT HYPERSPACE', cx, H/2 + 55*UI_SCALE, 1*UI_SCALE, { align: 'center', glow: 4 });
    if (blinkOn()) {
      drawVectorText('PRESS ENTER OR TAP TO START', cx, H/2 + 95*UI_SCALE, 1*UI_SCALE, { align: 'center', glow: 4 });
    }
  }

  function drawGameOverScreen() {
    const cx = W / 2;
    drawVectorText('GAME OVER', cx, H/2 - 10*UI_SCALE, 3.5*UI_SCALE, { align: 'center', glow: 9 });
    drawVectorText('SCORE:' + score, cx, H/2 + 40*UI_SCALE, 1.3*UI_SCALE, { align: 'center', glow: 5 });
    if (blinkOn()) {
      drawVectorText('PRESS ENTER OR TAP TO RESTART', cx, H/2 + 80*UI_SCALE, 1*UI_SCALE, { align: 'center', glow: 4 });
    }
  }

  function draw() {
    ctx.fillStyle = currentBgColor();
    ctx.fillRect(0, 0, W, H);
    drawScopeGrid();
    drawStars();
    if (state === 'levelstart') {
      drawWarpStreaks(warpIntensity);
    }

    if (state === 'playing' || state === 'levelstart') {
      drawTrail();
      drawShip();
      drawDrones();
      for (const a of asteroids) drawAsteroid(a);
      drawBullets(bullets);
      drawBullets(saucerBullets, '255,59,59');
      drawMissiles();
      drawParticles();
      drawPickups();
      drawSaucer();
    }

    if (state === 'approaching' || state === 'docked' || state === 'shop') {
      if (state === 'approaching') drawStationEngineSmoke();
      drawSpaceStation(station.x, station.y, station.width, station.angle, stationColor(), station.alpha);
      if (state === 'approaching') drawStationOpeningMarker();
      drawShip();
    }

    if (state === 'intro') drawIntroScreen();
    if (state === 'menu') drawMenuScreen();
    if (state === 'gameover') drawGameOverScreen();

    drawVignette();
    drawPlayAreaBoundary();

    if (state === 'playing' || state === 'levelstart' || state === 'approaching') {
      drawHud();
    }

    if (state === 'docked' && dockingResultText) {
      drawVectorText(dockingResultText, 20 * UI_SCALE, H - 30 * UI_SCALE, 1.4 * UI_SCALE,
        { color: 'rgb(150,235,255)', glow: 6 });
    }

    if (state === 'shop') {
      drawShopUI();
    }
  }

  // ---------- Main loop ----------
  function updateHeartbeat() {
    heartbeatTimer--;
    if (heartbeatTimer <= 0) {
      if (heartbeatToggle) sfx.heartbeat1(); else sfx.heartbeat2();
      heartbeatToggle = !heartbeatToggle;

      const remainingRatio = initialAsteroidCount > 0
        ? asteroids.length / initialAsteroidCount
        : 1;
      let frames = HEARTBEAT_MIN_FRAMES + (HEARTBEAT_MAX_FRAMES - HEARTBEAT_MIN_FRAMES) * remainingRatio;
      if (saucer) frames *= 0.6; // extra tension while the saucer is around
      heartbeatTimer = Math.max(HEARTBEAT_MIN_FRAMES, Math.round(frames));
    }
  }

  function update() {
    updateStars();
    updateBgColor();
    if (state === 'playing') {
      updateShip();
      updateBullets(bullets);
      updateBullets(saucerBullets);
      updateAsteroids();
      resolveDustInteractions();
      updateParticles();
      updateTrail();
      updatePickups();
      updateMissiles();
      updateDrones();
      maybeSpawnSaucer();
      updateSaucer();
      checkCollisions();
      updateHeartbeat();
      if (activeBuff) {
        activeBuff.timer--;
        if (activeBuff.timer <= 0) activeBuff = null;
      }
    } else if (state === 'levelstart') {
      if (thrustSoundOn) { setThrustSound(false); thrustSoundOn = false; }

      const t = Math.min(1, Math.max(0, 1 - stateTimer / LEVEL_TRANSITION_FRAMES));
      const half = WARP_FADE_START;

      // two phases: (1) fly to center + build up speed/shrink, (2) already
      // centered, decelerate and let the streaks fade + ship grow back out
      let posT, decayT;
      if (t <= half) {
        posT = smoothstep(t / half);
        decayT = 0;
        warpIntensity = posT;
      } else {
        posT = 1;
        decayT = smoothstep((t - half) / (1 - half));
        warpIntensity = 1 - decayT;
      }

      if (transitionShip && ship) {
        ship.x = lerp(transitionShip.startX, W/2, posT);
        ship.y = lerp(transitionShip.startY, H/2, posT);
        ship.angle = lerpAngle(transitionShip.startAngle, -Math.PI/2, posT);
        ship.scale = t <= half
          ? lerp(1, WARP_SHIP_MIN_SCALE, posT)
          : lerp(WARP_SHIP_MIN_SCALE, 1, decayT);
      }
      updateWarpStreaks(warpIntensity);

      if (!levelSpawnedThisTransition && t >= WARP_ASTEROID_SPAWN_T) {
        if (!pendingStationVisit) startLevel();
        levelSpawnedThisTransition = true;
      }
      updateAsteroids();

      updateParticles();
      updateTrail();
      stateTimer--;
      if (stateTimer <= 0) {
        transitionShip = null;
        warpIntensity = 0;
        ship.scale = 1;
        if (pendingStationVisit) {
          pendingStationVisit = false;
          state = 'approaching';
          beginStationApproach();
        } else {
          state = 'playing';
        }
      }
    } else if (state === 'approaching') {
      updateStationArrival();
      updateStationEnginePush();
      updateShip();
      checkStationHullCollision();
      checkStationDocking();
      updateStationEngineSmoke();
    } else if (state === 'docked') {
      station.angle += STATION_SPIN_RATE * STATION_SPIN_MULTIPLIER;
      if (stationDockFadeT < 1) {
        stationDockFadeT = Math.min(1, stationDockFadeT + 0.02);
      } else {
        state = 'shop';
        stationShopFadeT = 0;
      }
    } else if (state === 'shop') {
      station.angle += STATION_SPIN_RATE * STATION_SPIN_MULTIPLIER;
      station.alpha = Math.max(0, 1 - stationShopFadeT);
      if (stationShopFadeT < 1) stationShopFadeT = Math.min(1, stationShopFadeT + 0.035);
      if (stationShopMessageTimer > 0) stationShopMessageTimer--;
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  resizeCanvas();
  loop();
})();
</script>
