<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PONG</title>
<style>
  :root {
    --bg: #2a2419;
    --fg: #f5f5f5;
    --dim: #4a4a4a;
    --accent: #39ff88;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    overscroll-behavior: none;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: min(94vw, calc(84vh * 0.65625));
    max-height: 100vh;
    box-sizing: border-box;
    padding: 8px 0;
  }
  #canvasHolder {
    position: relative;
    width: 100%;
    max-height: 84vh;
    display: flex;
    justify-content: center;
  }
  canvas {
    background: var(--bg);
    border: 2px solid var(--dim);
    box-shadow: 0 0 24px rgba(57,255,136,0.08);
    touch-action: none;
    cursor: none;
    width: 100%;
    height: auto;
    max-height: 84vh;
    aspect-ratio: 420 / 640;
    display: block;
  }
  #msg {
    color: var(--fg);
    font-size: clamp(10px, 2.8vw, 13px);
    opacity: 0.55;
    text-align: center;
    letter-spacing: 1px;
  }
  #introScreen {
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(57,255,136,0.05) 0px, rgba(57,255,136,0.05) 1px, transparent 1px, transparent 80px),
      repeating-linear-gradient(90deg, rgba(57,255,136,0.05) 0px, rgba(57,255,136,0.05) 1px, transparent 1px, transparent 80px),
      #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    z-index: 100;
    cursor: pointer;
    transition: opacity 0.4s ease;
  }
  #introScreen.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #introLogo {
    width: min(72vw, 360px);
    height: auto;
  }
  #introPrompt {
    width: min(80vw, 260px);
    height: auto;
    aspect-ratio: 260 / 30;
    animation: introBlink 1.4s steps(1) infinite;
  }
  @keyframes introBlink {
    0%, 49% { opacity: 0.7; }
    50%, 100% { opacity: 0.15; }
  }
  #vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.75) 100%);
  }
  #hud {
    position: absolute;
    inset: 0;
    background: transparent;
    border: none;
    box-shadow: none;
    pointer-events: none;
  }
</style>
</head>

function drawVectorChar(ctx, ch, x, y, size) {
  const pts = VECTOR_FONT[ch];
  if (!pts) return;
  let penUp = true;
  ctx.beginPath();
  for (const pt of pts) {
    if (pt === 'FONT_LAST') break;
    if (pt === 'FONT_UP') { penUp = true; continue; }
    const sx = x + pt[0] * size;
    const sy = y - pt[1] * size; // font is y-up internally; canvas is y-down
    if (penUp) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    penUp = false;
  }
  ctx.stroke();
}

function drawVectorText(ctx, str, x, y, size, opts) {
  opts = opts || {};
  const color = opts.color || '#fff';
  const align = opts.align || 'left';
  str = String(str).toUpperCase();
  const charWidth = 12 * size;
  const totalWidth = str.length * charWidth;
  let startX = x;
  if (align === 'center') startX = x - totalWidth / 2;
  else if (align === 'right') startX = x - totalWidth;

  ctx.save();
  ctx.strokeStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = opts.glow !== undefined ? opts.glow : 0;
  ctx.lineWidth = opts.lineWidth || 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let i = 0; i < str.length; i++) {
    drawVectorChar(ctx, str[i], startX + i * charWidth, y, size);
  }
  ctx.restore();
}

  // is the canvas's actual backing-store resolution, which we keep in
  // sync with its live displayed CSS size (itself fully responsive) and
  // devicePixelRatio, so the game renders crisply at any window size or
  // screen density rather than stretching a fixed low-res raster.
  const W = 420, H = 640;

  function fitCanvasToDisplaySize(){
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return;
    const backingWidth = Math.max(1, Math.round(rect.width * dpr));
    const backingHeight = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== backingWidth || canvas.height !== backingHeight) {
      canvas.width = backingWidth;
      canvas.height = backingHeight;
      hudCanvas.width = backingWidth;
      hudCanvas.height = backingHeight;
    }

  // undelivered notifications" warning.
  let resizePending = false;

    if (resizePending) return;

    requestAnimationFrame(() => {
      resizePending = false;
      fitCanvasToDisplaySize();

    A4: 440.00, C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880.00

  function playTone(freq, opts){
    opts = opts || {};

    const type = opts.type || 'square';

    osc.frequency.setValueAtTime(freq, now);
    if (opts.sweepTo) osc.frequency.exponentialRampToValueAtTime(opts.sweepTo, now + duration);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(gain, now + attack);

  function sfxCpuHit(paddleVX){

  function sfxPegBreak(multiplier){

    playClick({ duration: 0.008, gain: 0.08 });
    // triangle for a pingy chime, sine an octave up layered on for shimmer -

    playTone(note, { duration: 0.4, type: 'triangle', gain: 0.19, attack: 0.003 });

  function sfxGameOver(){

  const PADDLE_W = 70, PADDLE_H = 20;
  const BALL_SIZE = 16;
  const PLAYER_REST_Y = H - 90 - PADDLE_H;
  const CPU_Y = 90;
  const STARTING_LIVES = 3;
  const POST_POINT_DELAY_MS = 380; // brief pause between rallies, kept short for flow

  let playerX = W/2 - PADDLE_W/2;
  let cpuX = W/2 - PADDLE_W/2;
  let playerY = PLAYER_REST_Y;
  // High scores: a shared arcade-style top-10 list with 3-letter initials,
  // persisted via window.storage so it survives across sessions/users.

  const HIGH_SCORE_MAX = 10;
  const INITIAL_LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let highScores = [];
  let highScoresLoaded = false;
  let gameOverPhase = 'board'; // 'enterInitials' | 'board'
  let initialsSlots = ['A', 'A', 'A'];
  let initialsSlotIndex = 0;

  async function loadHighScores(){
    try {
      const result = await window.storage.get(HIGH_SCORE_KEY, true);
      highScores = result ? JSON.parse(result.value) : [];
    } catch (e) {
      highScores = [];
    }

  }
  loadHighScores();

  function scoreQualifies(s){
    if (!highScoresLoaded) return false;
    if (highScores.length < HIGH_SCORE_MAX) return true;
    return s > highScores[highScores.length - 1].score;
  }

  function cycleInitial(delta){
    let idx = INITIAL_LETTERS.indexOf(initialsSlots[initialsSlotIndex]);
    idx = (idx + delta + INITIAL_LETTERS.length) % INITIAL_LETTERS.length;
    initialsSlots[initialsSlotIndex] = INITIAL_LETTERS[idx];
  }

  async function submitInitials(){
    const entry = { initials: initialsSlots.join(''), score };
    highScores.push(entry);
    highScores.sort((a, b) => b.score - a.score);
    highScores = highScores.slice(0, HIGH_SCORE_MAX);
    gameOverPhase = 'board';
    try {
      await window.storage.set(HIGH_SCORE_KEY, JSON.stringify(highScores), true);
    } catch (e) { /* best-effort */ }
  }

  function advanceInitialsSlot(){
    if (initialsSlotIndex < 2) {
      initialsSlotIndex++;
    } else {

    }
  }

  let score = 0;
  let lives = STARTING_LIVES;

  // Background slowly cycles through dark, low-saturation colors as
  // score climbs - a full fade completes every 1000 points, then moves
  // on to the next color in the palette (wrapping around indefinitely).
  const BG_PALETTE = [
    { r: 42, g: 36, b: 25 },  // dark beige (original)
    { r: 26, g: 32, b: 42 },  // dark slate blue
    { r: 36, g: 28, b: 42 },  // dark muted purple
    { r: 24, g: 38, b: 36 },  // dark muted teal
    { r: 42, g: 28, b: 30 }   // dark muted maroon
  ];
  const BG_POINTS_PER_STEP = 1000;
  const BG_EASE = 0.03; // smooths out big score jumps into a gradual fade
  let bgColor = { ...BG_PALETTE[0] };

  function getTargetBgColor(){
    const idx = Math.floor(score / BG_POINTS_PER_STEP);
    const t = (score % BG_POINTS_PER_STEP) / BG_POINTS_PER_STEP;
    const a = BG_PALETTE[idx % BG_PALETTE.length];
    const b = BG_PALETTE[(idx + 1) % BG_PALETTE.length];
    return {
      r: a.r + (b.r - a.r) * t,
      g: a.g + (b.g - a.g) * t,
      b: a.b + (b.b - a.b) * t
    };
  }

  let comboMultiplier = 0; // 0 = no active combo; increments each peg broken while the previous combo window is still open

  let prevCpuX = cpuX;
  let prevPlayerY = playerY;

  let playerFlashUntil = 0;
  let cpuFlashUntil = 0;

  // Score pegs: every time the player scores, a peg joins a formation
  // centered on the field. Each is ball-sized, drawn at half the ball's
  // opacity. Touching one with the ball breaks it - a hard-edged pixel
  // particle burst - and awards a bonus point; survivors reflow into
  // the formation for whatever count remains.
  const SCORE_SQUARE_ALPHA = 1;
  const SQUARE_CORE_OFFSET = 34; // distance from center for the 1st-4th peg formation
  const SQUARE_RING_CAPACITY = 8;
  const SQUARE_RING_STEP = 30;
  const SQUARE_EASE = 0.18; // how quickly a peg glides to its new spot

  // Peg colors, cycled through in creation order.
  const PEG_COLORS = [
    { r: 230, g: 72,  b: 63  }, // red
    { r: 230, g: 154, b: 63  }, // orange
    { r: 87,  g: 207, b: 107 }, // green
    { r: 232, g: 217, b: 74  }, // yellow
    { r: 123, g: 79,  b: 176 }  // purple
  ];

  let scoreSquares = []; // { x, y, targetX, targetY, hit, color }

  function computeSquareCenters(count){
    const centers = [];
    if (count <= 0) return centers;
    const d = SQUARE_CORE_OFFSET;

    if (count === 1) {
      // dead center
      centers.push({ x: W/2, y: H/2 });
    } else if (count === 2) {
      // pair straddling center, both at the vertical middle
      centers.push({ x: W/2 - d, y: H/2 });
      centers.push({ x: W/2 + d, y: H/2 });
    } else if (count === 3) {
      // "wasd": two on the bottom row, one above them
      centers.push({ x: W/2 - d, y: H/2 + d });
      centers.push({ x: W/2 + d, y: H/2 + d });
      centers.push({ x: W/2, y: H/2 - d });
    } else if (count === 4) {
      // "dpad": up / down / left / right diamond
      centers.push({ x: W/2 - d, y: H/2 });     // left
      centers.push({ x: W/2 + d, y: H/2 });     // right
      centers.push({ x: W/2, y: H/2 - d });     // up
      centers.push({ x: W/2, y: H/2 + d });     // down
    } else if (count === 5) {
      // die face "5": four corners plus the center
      centers.push({ x: W/2 - d, y: H/2 - d });
      centers.push({ x: W/2 + d, y: H/2 - d });
      centers.push({ x: W/2, y: H/2 });
      centers.push({ x: W/2 - d, y: H/2 + d });
      centers.push({ x: W/2 + d, y: H/2 + d });
    } else if (count === 6) {
      // die face "6": two columns of three rows
      const rowStep = d * 1.1;
      for (const ry of [-rowStep, 0, rowStep]) {
        centers.push({ x: W/2 - d, y: H/2 + ry });
        centers.push({ x: W/2 + d, y: H/2 + ry });
      }
    } else {
      // beyond a die's worth of pegs: dpad diamond core, plus expanding
      // symmetric rings for everything past that
      centers.push({ x: W/2 - d, y: H/2 });     // left
      centers.push({ x: W/2 + d, y: H/2 });     // right
      centers.push({ x: W/2, y: H/2 - d });     // up
      centers.push({ x: W/2, y: H/2 + d });     // down

      let remaining = count - 4;
      let ring = 1;
      while (remaining > 0) {
        const inRing = Math.min(remaining, SQUARE_RING_CAPACITY);
        const radius = d + ring * SQUARE_RING_STEP;
        for (let i = 0; i < inRing; i++) {
          const angle = (i / inRing) * Math.PI * 2 + ring * 0.3 + Math.PI/4;
          centers.push({ x: W/2 + radius * Math.cos(angle), y: H/2 + radius * Math.sin(angle) });
        }
        remaining -= inRing;
        ring++;
      }
    }
    return centers;
  }

  function reflowScoreSquares(){
    const centers = computeSquareCenters(scoreSquares.length);
    for (let i = 0; i < scoreSquares.length; i++) {
      scoreSquares[i].targetX = centers[i].x - BALL_SIZE/2;
      scoreSquares[i].targetY = centers[i].y - BALL_SIZE/2;
    }
  }

  function addScoreSquare(){
    const color = PEG_COLORS[scoreSquares.length % PEG_COLORS.length];
    scoreSquares.push({ x: W/2 - BALL_SIZE/2, y: H/2 - BALL_SIZE/2, targetX: 0, targetY: 0, hit: false, color });
    reflowScoreSquares();

  // Particle burst: hard-edged pixel squares that fly outward when a peg
  // breaks - no blur, no gradients, just flat little chips. No gravity;
  // they drift freely and linger, but get caught in a vortex whenever the
  // ball passes near them, swirling around it before drifting free again.
  const PARTICLE_COUNT = 50;
  const PARTICLE_SIZE = 2;
  const PARTICLE_SPEED_MIN = 3.0;
  const PARTICLE_SPEED_MAX = 9.0;
  const PARTICLE_LIFETIME_MS = 5000;
  const COMBO_WINDOW_MS = PARTICLE_LIFETIME_MS; // combo stays alive as long as particles still linger
  const PARTICLE_FRICTION = 0.90; // strong drag: quick burst, then settles into a slow drift
  const PARTICLE_MIN_DRIFT_SPEED = 0.15; // floor so they never fully stop, just creep onward
  const PARTICLE_VORTEX_RADIUS = 45; // ball must be quite close to catch a particle
  const PARTICLE_VORTEX_STRENGTH = 0.9; // swirl acceleration at closest approach
  const PARTICLE_VORTEX_MIN_DIST = 10; // avoids a singularity right at the ball's center

  let particles = []; // { x, y, vx, vy, startTime }

  function spawnBurst(cx, cy, color){
    const now = performance.now();
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = PARTICLE_SPEED_MIN + Math.random() * (PARTICLE_SPEED_MAX - PARTICLE_SPEED_MIN);
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        startTime: now,
        color: color || { r: 245, g: 245, b: 245 }
      });
    }
  }

  function updateParticles(now){
    particles = particles.filter(p => now - p.startTime < PARTICLE_LIFETIME_MS);

    const ballCenterX = ball.x + BALL_SIZE/2;
    const ballCenterY = ball.y + BALL_SIZE/2;

    for (const p of particles) {
      const dx = ballCenterX - p.x;
      const dy = ballCenterY - p.y;
      const dist = Math.max(PARTICLE_VORTEX_MIN_DIST, Math.sqrt(dx*dx + dy*dy));

      if (dist < PARTICLE_VORTEX_RADIUS) {
        const nx = dx / dist, ny = dy / dist;
        const tx = -ny, ty = nx; // perpendicular to the ball direction: the swirl
        const strength = PARTICLE_VORTEX_STRENGTH * (1 - dist / PARTICLE_VORTEX_RADIUS);
        p.vx += (tx + nx * 0.25) * strength;
        p.vy += (ty + ny * 0.25) * strength;
      }

      p.vx *= PARTICLE_FRICTION;
      p.vy *= PARTICLE_FRICTION;

      // never quite let them stop - a slow residual drift continues
      // outward in whatever direction they were already heading.
      const speed = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
      if (speed > 0.0001 && speed < PARTICLE_MIN_DRIFT_SPEED) {
        const scale = PARTICLE_MIN_DRIFT_SPEED / speed;
        p.vx *= scale;
        p.vy *= scale;
      }

      p.x += p.vx;
      p.y += p.vy;
    }
  }

  function drawParticles(now){
    for (const p of particles) {
      const t = (now - p.startTime) / PARTICLE_LIFETIME_MS;
      // hold near-full brightness, then fade out over the last stretch
      const alpha = t < 0.2 ? 1 : Math.max(0, 1 - (t - 0.2) / 0.8);
      ctx.fillStyle = `rgb(${p.color.r}, ${p.color.g}, ${p.color.b})`;
      ctx.globalAlpha = alpha;
      ctx.fillRect(p.x - PARTICLE_SIZE/2, p.y - PARTICLE_SIZE/2, PARTICLE_SIZE, PARTICLE_SIZE);
    }
    ctx.globalAlpha = 1;
  }


  // Spin: dragging the paddle sideways as it hits the ball bends the
  // ball's onward path. A slice of the paddle's own horizontal motion
  // is nudged straight into the ball's velocity on impact, and a portion
  // carries on afterward as ongoing curvature that fades over time.
  const SPIN_IMPACT_FACTOR = 0.4; // paddle velocity -> immediate vx kick
  const SPIN_CARRY_FACTOR = 0.6;  // paddle velocity -> lingering curve
  const SPIN_ACCEL = 0.06;        // how strongly lingering spin bends vx per frame
  const SPIN_DECAY = 0.97;        // spin fades out over time
  const MAX_PADDLE_VX_FOR_SPIN = 20; // clamp on input so a huge mouse jump can't break physics
  const MAX_SPIN = 6;
  const MAX_BALL_VX = 20;

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

  const NUDGE_DISTANCE = 55;
  const NUDGE_OUT_MS = 1; // effectively instant: fully forward within the next frame
  const NUDGE_HOLD_MS = 10;
  const NUDGE_BACK_MS = 90;
  const SWIPE_UP_PX = 30;      // upward pointer travel needed to trigger
  const SWIPE_WINDOW_MS = 160; // time window that travel must happen within

  let nudgeStartTime = 0;
  let pointerYSamples = [];

  // a smash triggers, then fades out - a bolder cue than the ghost copies
  // since the nudge motion itself is now almost too fast to see.
  const BEAM_LENGTH = 130;
  const BEAM_DURATION_MS = 200;
  const BEAM_MAX_ALPHA = 0.55;
  let beamStartTime = -Infinity;

  function triggerNudge(){
    if (nudgeState === 'idle') {
      nudgeState = 'out';
      nudgeStartTime = performance.now();
      beamStartTime = nudgeStartTime;
      ensureAudio();
      sfxSmashSwipe();
    }
  }

  function trackPointerY(clientY){
    const now = performance.now();
    pointerYSamples.push({ t: now, y: clientY });
    while (pointerYSamples.length && now - pointerYSamples[0].t > SWIPE_WINDOW_MS) {
      pointerYSamples.shift();
    }
    if (pointerYSamples.length > 1) {
      const travel = pointerYSamples[0].y - pointerYSamples[pointerYSamples.length - 1].y;
      if (gameOver && gameOverPhase === 'enterInitials') {
        if (travel > SWIPE_UP_PX) { cycleInitial(1); pointerYSamples = []; }
        else if (travel < -SWIPE_UP_PX) { cycleInitial(-1); pointerYSamples = []; }
      } else if (travel > SWIPE_UP_PX) {
        triggerNudge();
        pointerYSamples = [];
      }
    }
  }

  function updateNudge(now){
    if (nudgeState === 'idle') {
      playerY = PLAYER_REST_Y;
      return;
    }
    const elapsed = now - nudgeStartTime;
    if (nudgeState === 'out') {
      if (elapsed >= NUDGE_OUT_MS) {
        nudgeState = 'hold';
        nudgeStartTime = now;
        playerY = PLAYER_REST_Y - NUDGE_DISTANCE;
      } else {
        const t = elapsed / NUDGE_OUT_MS;
        const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic: fast snap forward
        playerY = PLAYER_REST_Y - NUDGE_DISTANCE * eased;
      }
    } else if (nudgeState === 'hold') {
      playerY = PLAYER_REST_Y - NUDGE_DISTANCE;
      if (elapsed >= NUDGE_HOLD_MS) {
        nudgeState = 'back';
        nudgeStartTime = now;
      }
    } else if (nudgeState === 'back') {
      if (elapsed >= NUDGE_BACK_MS) {
        nudgeState = 'idle';
        playerY = PLAYER_REST_Y;
      } else {
        const t = elapsed / NUDGE_BACK_MS;
        const eased = t * t; // ease-in: slower start, settles back into place
        playerY = PLAYER_REST_Y - NUDGE_DISTANCE * (1 - eased);
      }
    }
  }

  // Ghost trail: a handful of hard-edged, semi-transparent copies placed
  // behind the ball/paddle at a distance proportional to its current
  // velocity - like a phosphor remnant on an old CRT rather than a blur.
  const GHOST_COUNT = 5;
  const GHOST_STEP = 1.3; // spacing multiplier per ghost, scales with speed
  const GHOST_ALPHAS = [0.32, 0.23, 0.15, 0.09, 0.05];
  const GHOST_MIN_SPEED = 0.4; // below this, no ghosts (treat as stationary)
  const GHOST_VELOCITY_SMOOTHING = 0.85; // higher = ghosts linger longer after motion stops
  const NUDGE_GHOST_SMOOTHING = 0.975; // separate, longer linger for the smash's vertical ghost

  let smoothedPlayerVX = 0, smoothedPlayerVY = 0, smoothedCpuVX = 0, smoothedBallVX = 0, smoothedBallVY = 0;

  function drawGhosts(x, y, w, h, vx, vy){
    if (Math.abs(vx) < GHOST_MIN_SPEED && Math.abs(vy) < GHOST_MIN_SPEED) return;
    for (let i = 0; i < GHOST_COUNT; i++) {
      const dist = (i + 1) * GHOST_STEP;
      ctx.globalAlpha = GHOST_ALPHAS[i];
      ctx.fillRect(x - vx * dist, y - vy * dist, w, h);
    }
    ctx.globalAlpha = 1;
  }

  let running = false;
  let gameOver = false;
  let hasServedOnce = false; // so the "PONG" title only shows before the very first serve
  let rallyCount = 0;

  // Serve grace: right after a serve, pegs can't be broken for a brief
  // moment. This stops a peg that spawns at the ball's serve point from
  // getting destroyed the instant the rally starts.
  const SERVE_GRACE_MS = 300;
  let serveGraceUntil = 0;

  // A point scored doesn't spawn its peg immediately - it waits until
  // the next serve, so the peg visually appears to split off the ball
  // as it reappears at center, rather than popping in during the pause.
  let pendingPlayerPeg = false;

  function resetBall(direction){
    ball.x = W/2;
    ball.y = H/2;
    ball.speed = 5;
    ball.spin = 0;
    const angle = (Math.random() * 0.6 - 0.3); // radians, slight variance from vertical
    ball.vx = Math.sin(angle) * ball.speed;
    ball.vy = Math.cos(angle) * ball.speed * direction;
    rallyCount = 0;
  }

  function startRound(direction){
    resetBall(direction);
    if (pendingPlayerPeg) {
      addScoreSquare();
      pendingPlayerPeg = false;
    }
    serveGraceUntil = performance.now() + SERVE_GRACE_MS;
    running = true;
    hasServedOnce = true;
    ensureAudio();
    sfxServe();
  }

  // Input: mouse / touch (horizontal movement)
  function movePlayerTo(clientX){
    const rect = canvas.getBoundingClientRect();
    const scale = W / rect.width;
    let x = (clientX - rect.left) * scale - PADDLE_W/2;
    x = Math.max(0, Math.min(W - PADDLE_W, x));
    playerX = x;
  }
  canvas.addEventListener('mousemove', (e) => {
    movePlayerTo(e.clientX);
    trackPointerY(e.clientY);
  });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    movePlayerTo(e.touches[0].clientX);
    trackPointerY(e.touches[0].clientY);
  }, { passive: false });

  // Input: keyboard
  const keys = {};
  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();

    if (gameOver && gameOverPhase === 'enterInitials') {
      if (e.key === 'ArrowUp' && !e.repeat) cycleInitial(1);
      if (e.key === 'ArrowDown' && !e.repeat) cycleInitial(-1);
      if (e.key === 'ArrowLeft' && !e.repeat) initialsSlotIndex = Math.max(0, initialsSlotIndex - 1);
      if ((e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') && !e.repeat) advanceInitialsSlot();
      return;
    }

    if (e.key === 'ArrowUp' && !e.repeat) triggerNudge();
    if (e.key === ' ' && !running && !gameOver) startRound(Math.random() < 0.5 ? -1 : 1);
    if (e.key === ' ' && gameOver && gameOverPhase === 'board') resetGame();
  });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });
  canvas.addEventListener('click', () => {
    if (gameOver && gameOverPhase === 'enterInitials') { advanceInitialsSlot(); return; }
    if (!running && !gameOver) startRound(Math.random() < 0.5 ? -1 : 1);
    if (gameOver && gameOverPhase === 'board') resetGame();
  });

  function resetGame(){
    ensureAudio();
    score = 0;
    lives = STARTING_LIVES;
    bgColor = { ...BG_PALETTE[0] };
    hasServedOnce = false;
    comboMultiplier = 0;
    comboWindowEnd = 0;
    gameOver = false;
    playerX = W/2 - PADDLE_W/2;
    cpuX = W/2 - PADDLE_W/2;
    prevPlayerX = playerX;
    prevCpuX = cpuX;
    nudgeState = 'idle';
    playerY = PLAYER_REST_Y;
    prevPlayerY = playerY;
    pointerYSamples = [];
    beamStartTime = -Infinity;
    scoreSquares = [];
    particles = [];
    pendingPlayerPeg = false;
    serveGraceUntil = 0;
    gameOverPhase = 'board';
    running = false;
  }

  function updateKeyboardPaddle(){
    const kbSpeed = 7;
    if (keys['ArrowLeft']) playerX -= kbSpeed;
    if (keys['ArrowRight']) playerX += kbSpeed;
    playerX = Math.max(0, Math.min(W - PADDLE_W, playerX));
  }

  function updateCPU(){
    // CPU tracks the ball horizontally with capped speed and a touch of
    // imperfection, so it's beatable but not trivial.
    const center = cpuX + PADDLE_W/2;
    const target = ball.x;
    const cpuMaxSpeed = 4.6;
    const dead = 6;
    let diff = target - center;
    if (Math.abs(diff) > dead) {
      cpuX += Math.sign(diff) * Math.min(cpuMaxSpeed, Math.abs(diff) * 0.12 + 2);
    }
    cpuX = Math.max(0, Math.min(W - PADDLE_W, cpuX));
  }

  function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
    return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
  }

  function update(){
    if (!running) return;

    updateKeyboardPaddle();
    updateCPU();

    // Apply any lingering spin from the last paddle contact: a gentle,
    // decaying sideways pull that bends the flight path, then fades out.
    if (ball.spin) {
      ball.vx = clamp(ball.vx + ball.spin * SPIN_ACCEL, -MAX_BALL_VX, MAX_BALL_VX);
      ball.spin *= SPIN_DECAY;
      if (Math.abs(ball.spin) < 0.02) ball.spin = 0;
    }

    // Substep the ball's motion so a fast-moving ball (or a fast-moving
    // paddle mid-smash) can't tunnel past a paddle between frames.
    const SUBSTEPS = 8;
    let stepVX = ball.vx / SUBSTEPS;
    let stepVY = ball.vy / SUBSTEPS;
    let bounced = false;

    for (let s = 1; s <= SUBSTEPS && !bounced; s++) {
      ball.x += stepVX;
      ball.y += stepVY;

      // left/right walls
      if (ball.x <= 0) { ball.x = 0; ball.vx *= -1; stepVX *= -1; sfxWallBounce(); }
      if (ball.x + BALL_SIZE >= W) { ball.x = W - BALL_SIZE; ball.vx *= -1; stepVX *= -1; sfxWallBounce(); }

      // interpolate the player paddle's position across the frame - both
      // axes, since a fast horizontal drag (e.g. a top-spin swipe) can
      // move it a long way in a single frame too, not just a smash.
      const framePlayerX = prevPlayerX + (playerX - prevPlayerX) * (s / SUBSTEPS);
      const framePlayerY = prevPlayerY + (playerY - prevPlayerY) * (s / SUBSTEPS);

      // player paddle collision (bottom). The faster the paddle is moving
      // this frame, the more forgiving its hitbox - catches fast spin
      // swipes that would otherwise graze past the ball. A smash gets an
      // even bigger, fixed margin plus a narrower angle spread so an
      // imperfect connect still reliably sends the ball back with force.
      const smashingNow = (nudgeState === 'out' || nudgeState === 'hold');
      const paddleSpeedMag = Math.abs(playerX - prevPlayerX);
      const speedForgiveness = Math.min(14, paddleSpeedMag * 0.6);
      const hitboxMarginX = smashingNow ? 20 : speedForgiveness;
      const hitboxMarginY = smashingNow ? 55 : speedForgiveness;
      if (ball.vy > 0 && rectsOverlap(ball.x, ball.y, BALL_SIZE, BALL_SIZE, framePlayerX - hitboxMarginX, framePlayerY - hitboxMarginY, PADDLE_W + hitboxMarginX * 2, PADDLE_H + hitboxMarginY * 2)) {
        ball.y = framePlayerY - BALL_SIZE;
        const hit = (ball.x + BALL_SIZE/2) - (framePlayerX + PADDLE_W/2);
        const norm = clamp(hit / (PADDLE_W/2), -1, 1);
        const smashing = smashingNow;
        const speedGain = smashing ? 2.6 : 0.35;
        const maxSpeed = smashing ? 18 : 12;
        ball.speed = Math.min(ball.speed + speedGain, maxSpeed);
        const angleRange = smashing ? Math.PI/4.5 : Math.PI/3.2;
        const angle = norm * angleRange;
        ball.vx = Math.sin(angle) * ball.speed;
        ball.vy = -Math.cos(angle) * ball.speed;

        const paddleVX = clamp(playerX - prevPlayerX, -MAX_PADDLE_VX_FOR_SPIN, MAX_PADDLE_VX_FOR_SPIN);
        ball.vx = clamp(ball.vx + paddleVX * SPIN_IMPACT_FACTOR, -MAX_BALL_VX, MAX_BALL_VX);
        ball.spin = clamp(paddleVX * SPIN_CARRY_FACTOR, -MAX_SPIN, MAX_SPIN);

        rallyCount++;
        bounced = true;
        playerFlashUntil = performance.now() + HIT_FLASH_MS;
        if (smashing) sfxSmashHit(paddleVX); else sfxPaddleHit(paddleVX);
      }

      // cpu paddle collision (top)
      if (!bounced && ball.vy < 0 && rectsOverlap(ball.x, ball.y, BALL_SIZE, BALL_SIZE, cpuX, CPU_Y, PADDLE_W, PADDLE_H)) {
        ball.y = CPU_Y + PADDLE_H;
        const hit = (ball.x + BALL_SIZE/2) - (cpuX + PADDLE_W/2);
        const norm = hit / (PADDLE_W/2);
        ball.speed = Math.min(ball.speed + 0.35, 12);
        const angle = norm * (Math.PI/3.2);
        ball.vx = Math.sin(angle) * ball.speed;
        ball.vy = Math.cos(angle) * ball.speed;

        const paddleVX = clamp(cpuX - prevCpuX, -MAX_PADDLE_VX_FOR_SPIN, MAX_PADDLE_VX_FOR_SPIN);
        ball.vx = clamp(ball.vx + paddleVX * SPIN_IMPACT_FACTOR, -MAX_BALL_VX, MAX_BALL_VX);
        ball.spin = clamp(paddleVX * SPIN_CARRY_FACTOR, -MAX_SPIN, MAX_SPIN);

        rallyCount++;
        bounced = true;
        cpuFlashUntil = performance.now() + HIT_FLASH_MS;
        sfxCpuHit(paddleVX);
      }
    }

    // Score pegs: ease toward their target formation position; breaking
    // one on contact awards points (with a combo multiplier if another
    // peg broke recently) and bursts it into particles.
    // (Skipped briefly right after a serve - see SERVE_GRACE_MS - so a
    // peg spawning at the ball's serve point doesn't die on frame one.)
    let pegBroken = false;
    for (const sq of scoreSquares) {
      sq.x += (sq.targetX - sq.x) * SQUARE_EASE;
      sq.y += (sq.targetY - sq.y) * SQUARE_EASE;
    }
    if (performance.now() >= serveGraceUntil) {
      for (const sq of scoreSquares) {
        if (!sq.hit && rectsOverlap(ball.x, ball.y, BALL_SIZE, BALL_SIZE, sq.x, sq.y, BALL_SIZE, BALL_SIZE)) {
          sq.hit = true;
          pegBroken = true;

          const breakNow = performance.now();
          comboMultiplier = (breakNow <= comboWindowEnd) ? comboMultiplier + 1 : 1;
          comboWindowEnd = breakNow + COMBO_WINDOW_MS;
          score += 100 * comboMultiplier;
          sfxPegBreak(comboMultiplier);

          spawnBurst(sq.x + BALL_SIZE/2, sq.y + BALL_SIZE/2, sq.color);
        }
      }
    }
    if (pegBroken) {
      scoreSquares = scoreSquares.filter(sq => !sq.hit);
      reflowScoreSquares();
    }

    // scoring / lives
    if (ball.y < -BALL_SIZE) {
      score += 50;
      pendingPlayerPeg = true;
      sfxGoal();
      afterPoint(1);
    } else if (ball.y > H + BALL_SIZE) {
      lives--;
      if (lives <= 0) {
        triggerGameOver();
      } else {
        sfxLifeLost();
        afterPoint(-1);
      }
    }
  }

  function triggerGameOver(){
    gameOver = true;
    running = false;
    gameOverPhase = scoreQualifies(score) ? 'enterInitials' : 'board';
    initialsSlots = ['A', 'A', 'A'];
    initialsSlotIndex = 0;
    sfxGameOver();
  }

  function afterPoint(nextDirection){
    running = false;
    setTimeout(() => { if (!gameOver) startRound(nextDirection); }, POST_POINT_DELAY_MS);
  }

  // HUD: lives shown as small paddle-bar icons top-left, score in the
  // Asteroids vector font top-right. Drawn straight onto the canvas so
  // it always matches the game's own scale and never needs DOM updates.
  const HUD_MARGIN_X = 16;
  const HUD_Y = 44;
  const LIFE_ICON_W = 18, LIFE_ICON_H = 7, LIFE_ICON_GAP = 6;

  function drawCenterMessage(){
    if (gameOver && gameOverPhase === 'enterInitials') {
      hudCtx.fillStyle = 'rgba(0,0,0,0.6)';
      hudCtx.fillRect(0, 0, W, H);
      drawVectorText(hudCtx, 'GAME OVER', W/2, 110, 1.1, { color: '#f5f5f5', align: 'center', glow: 2, lineWidth: 2 });
      drawVectorText(hudCtx, 'SCORE ' + score, W/2, 145, 0.75, { color: '#f5f5f5', align: 'center', glow: 1, lineWidth: 2 });
      drawVectorText(hudCtx, 'NEW HIGH SCORE!', W/2, 185, 0.9, { color: '#f5f5f5', align: 'center', glow: 2, lineWidth: 2 });

      const letterY = 300;
      const letterXs = [W/2 - 60, W/2, W/2 + 60];
      for (let i = 0; i < 3; i++) {
        const active = i === initialsSlotIndex;
        drawVectorText(hudCtx, initialsSlots[i], letterXs[i], letterY, 2.2, {
          color: '#f5f5f5', align: 'center', glow: active ? 6 : 1, lineWidth: 2
        });
        if (active) {
          hudCtx.strokeStyle = 'rgba(245,245,245,0.8)';
          hudCtx.lineWidth = 2;
          hudCtx.beginPath();
          hudCtx.moveTo(letterXs[i] - 14, letterY + 8);
          hudCtx.lineTo(letterXs[i] + 14, letterY + 8);
          hudCtx.stroke();
        }
      }

      drawVectorText(hudCtx, 'SWIPE OR ARROWS TO CHANGE', W/2, 370, 0.6, { color: '#f5f5f5', align: 'center', glow: 1, lineWidth: 2 });
      drawVectorText(hudCtx, 'TAP OR SPACE TO CONFIRM', W/2, 400, 0.6, { color: '#f5f5f5', align: 'center', glow: 1, lineWidth: 2 });
    } else if (gameOver && gameOverPhase === 'board') {
      hudCtx.fillStyle = 'rgba(0,0,0,0.6)';
      hudCtx.fillRect(0, 0, W, H);
      drawVectorText(hudCtx, 'GAME OVER', W/2, 110, 1.1, { color: '#f5f5f5', align: 'center', glow: 2, lineWidth: 2 });
      drawVectorText(hudCtx, 'SCORE ' + score, W/2, 145, 0.75, { color: '#f5f5f5', align: 'center', glow: 1, lineWidth: 2 });
      drawVectorText(hudCtx, 'HIGH SCORES', W/2, 185, 1.0, { color: '#f5f5f5', align: 'center', glow: 2, lineWidth: 2 });

      const rowStart = 225;
      const rowStep = 26;
      if (!highScoresLoaded) {
        drawVectorText(hudCtx, 'LOADING...', W/2, rowStart + rowStep * 2, 0.7, { color: '#f5f5f5', align: 'center', glow: 1, lineWidth: 2 });
      } else if (highScores.length === 0) {
        drawVectorText(hudCtx, 'NO SCORES YET', W/2, rowStart + rowStep * 2, 0.7, { color: '#f5f5f5', align: 'center', glow: 1, lineWidth: 2 });
      } else {
        for (let i = 0; i < highScores.length; i++) {
          const entry = highScores[i];
          const rank = String(i + 1).padStart(2, ' ');
          const sc = String(entry.score).padStart(5, ' ');
          const line = rank + '. ' + entry.initials + ' ' + sc;
          drawVectorText(hudCtx, line, W/2, rowStart + i * rowStep, 0.7, { color: '#f5f5f5', align: 'center', glow: 1, lineWidth: 2 });
        }
      }

      drawVectorText(hudCtx, 'CLICK OR SPACE TO RESTART', W/2, H - 50, 0.8, { color: '#f5f5f5', align: 'center', glow: 1, lineWidth: 2 });
    } else if (!running && !hasServedOnce) {
      hudCtx.fillStyle = 'rgba(0,0,0,0.6)';
      hudCtx.fillRect(0, 0, W, H);
      drawVectorText(hudCtx, 'PONG', W/2, H/2 - 10, 2.5, { color: '#f5f5f5', align: 'center', glow: 2, lineWidth: 2 });
      drawVectorText(hudCtx, 'CLICK OR SPACE TO SERVE', W/2, H/2 + 40, 0.9, { color: '#f5f5f5', align: 'center', glow: 1, lineWidth: 2 });
    }
  }

  function drawHUD(){
    // lives, top-left
    for (let i = 0; i < STARTING_LIVES; i++) {
      const lx = HUD_MARGIN_X + i * (LIFE_ICON_W + LIFE_ICON_GAP);
      const ly = HUD_Y - LIFE_ICON_H;
      if (i < lives) {
        hudCtx.fillStyle = '#f5f5f5';
        hudCtx.fillRect(lx, ly, LIFE_ICON_W, LIFE_ICON_H);
      } else {
        hudCtx.strokeStyle = 'rgba(245,245,245,0.3)';
        hudCtx.lineWidth = 1;
        hudCtx.strokeRect(lx + 0.5, ly + 0.5, LIFE_ICON_W - 1, LIFE_ICON_H - 1);
      }
    }

    // score, top-right, Asteroids vector font
    drawVectorText(hudCtx, String(score), W - HUD_MARGIN_X, HUD_Y, 1.3, {
      color: '#f5f5f5', align: 'right', glow: 1, lineWidth: 2
    });

    // combo multiplier, centered, only while the combo window is still open
    if (comboMultiplier >= 2 && performance.now() <= comboWindowEnd) {
      drawVectorText(hudCtx, comboMultiplier + 'X', W/2, HUD_Y, 1.3, {
        color: '#f5f5f5', align: 'center', glow: 2, lineWidth: 2
      });
    }
  }

  // Faint oscilloscope-style graticule, drawn behind everything else.
  const SCOPE_GRID_SPACING = 80;
  const SCOPE_GRID_COLOR = 'rgba(57,255,136,0.03)';
  const SCOPE_GRID_CENTER_COLOR = 'rgba(57,255,136,0.06)';

  // Subtle parallax: the grid drifts a little opposite the ball's vertical
  // position, smoothed so it eases rather than snapping frame to frame.
  const SCOPE_PARALLAX_MAX = 24; // max pixel shift at either extreme
  const SCOPE_PARALLAX_EASE = 0.05;
  let scopeGridOffsetX = 0;
  let scopeGridOffsetY = 0;

  function drawScopeGrid(){
    const targetOffsetX = ((playerX + PADDLE_W/2 - W/2) / (W/2)) * SCOPE_PARALLAX_MAX;
    const targetOffsetY = ((ball.y - H/2) / (H/2)) * SCOPE_PARALLAX_MAX;
    scopeGridOffsetX += (targetOffsetX - scopeGridOffsetX) * SCOPE_PARALLAX_EASE;
    scopeGridOffsetY += (targetOffsetY - scopeGridOffsetY) * SCOPE_PARALLAX_EASE;

    ctx.save();
    ctx.translate(scopeGridOffsetX, scopeGridOffsetY);
    ctx.lineWidth = 1;
    ctx.strokeStyle = SCOPE_GRID_COLOR;
    ctx.beginPath();
    for (let x = SCOPE_GRID_SPACING; x < W; x += SCOPE_GRID_SPACING) {
      ctx.moveTo(x + 0.5, 0);
      ctx.lineTo(x + 0.5, H);
    }
    for (let y = SCOPE_GRID_SPACING; y < H; y += SCOPE_GRID_SPACING) {
      ctx.moveTo(0, y + 0.5);
      ctx.lineTo(W, y + 0.5);
    }
    ctx.stroke();

    // slightly brighter crosshair through the center, like a scope's reticle
    ctx.strokeStyle = SCOPE_GRID_CENTER_COLOR;
    ctx.beginPath();
    ctx.moveTo(W/2 + 0.5, 0);
    ctx.lineTo(W/2 + 0.5, H);
    ctx.moveTo(0, H/2 + 0.5);
    ctx.lineTo(W, H/2 + 0.5);
    ctx.stroke();
    ctx.restore();
  }

  function drawPaddleWithFlash(x, y, flashUntil, now){
    const remaining = flashUntil - now;
    if (remaining > 0) {
      const t = remaining / HIT_FLASH_MS; // 1 -> 0 as the flash fades
      ctx.save();
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 18 * t;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x, y, PADDLE_W, PADDLE_H);
      ctx.restore();
    } else {
      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(x, y, PADDLE_W, PADDLE_H);
    }
  }

  function drawNet(){
    ctx.strokeStyle = 'rgba(245,245,245,0.35)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 10]);
    ctx.beginPath();
    ctx.moveTo(0, H/2);
    ctx.lineTo(W, H/2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawSmashBeam(now){
    const elapsed = now - beamStartTime;
    if (elapsed < 0 || elapsed >= BEAM_DURATION_MS) return;
    const t = elapsed / BEAM_DURATION_MS;
    const alpha = BEAM_MAX_ALPHA * (1 - t) * (1 - t); // ease-out: quick, bright flash
    const gradient = ctx.createLinearGradient(0, playerY, 0, playerY - BEAM_LENGTH);
    gradient.addColorStop(0, `rgba(245,245,245,${alpha})`);
    gradient.addColorStop(1, 'rgba(245,245,245,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(playerX, playerY - BEAM_LENGTH, PADDLE_W, BEAM_LENGTH);
  }

  function draw(){
    const now = performance.now();

    const targetBg = getTargetBgColor();
    bgColor.r += (targetBg.r - bgColor.r) * BG_EASE;
    bgColor.g += (targetBg.g - bgColor.g) * BG_EASE;
    bgColor.b += (targetBg.b - bgColor.b) * BG_EASE;
    ctx.fillStyle = `rgb(${bgColor.r | 0}, ${bgColor.g | 0}, ${bgColor.b | 0})`;
    ctx.fillRect(0, 0, W, H);

    drawScopeGrid();
    drawNet();
    drawSmashBeam(now);

    for (const sq of scoreSquares) {
      ctx.fillStyle = `rgba(${sq.color.r}, ${sq.color.g}, ${sq.color.b}, ${SCORE_SQUARE_ALPHA})`;
      ctx.fillRect(sq.x, sq.y, BALL_SIZE, BALL_SIZE);
    }

    updateParticles(now);
    drawParticles(now);

    ctx.fillStyle = '#f5f5f5';

    const playerVX = playerX - prevPlayerX;
    const playerVY = playerY - prevPlayerY;
    const cpuVX = cpuX - prevCpuX;

    smoothedPlayerVX = smoothedPlayerVX * GHOST_VELOCITY_SMOOTHING + playerVX * (1 - GHOST_VELOCITY_SMOOTHING);
    smoothedPlayerVY = smoothedPlayerVY * NUDGE_GHOST_SMOOTHING + playerVY * (1 - NUDGE_GHOST_SMOOTHING);
    smoothedCpuVX = smoothedCpuVX * GHOST_VELOCITY_SMOOTHING + cpuVX * (1 - GHOST_VELOCITY_SMOOTHING);
    smoothedBallVX = smoothedBallVX * GHOST_VELOCITY_SMOOTHING + ball.vx * (1 - GHOST_VELOCITY_SMOOTHING);
    smoothedBallVY = smoothedBallVY * GHOST_VELOCITY_SMOOTHING + ball.vy * (1 - GHOST_VELOCITY_SMOOTHING);

    drawGhosts(playerX, playerY, PADDLE_W, PADDLE_H, smoothedPlayerVX, smoothedPlayerVY);
    drawGhosts(cpuX, CPU_Y, PADDLE_W, PADDLE_H, smoothedCpuVX, 0);
    drawGhosts(ball.x, ball.y, BALL_SIZE, BALL_SIZE, smoothedBallVX, smoothedBallVY);

    drawPaddleWithFlash(playerX, playerY, playerFlashUntil, now);
    drawPaddleWithFlash(cpuX, CPU_Y, cpuFlashUntil, now);
    ctx.fillStyle = '#f5f5f5';
    ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);

    hudCtx.clearRect(0, 0, W, H);
    drawHUD();
    drawCenterMessage();

    prevPlayerX = playerX;
    prevPlayerY = playerY;
    prevCpuX = cpuX;
  }

  function loop(){
    updateNudge(performance.now());
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // Intro splash: dismissed by tap/click/key, or automatically after a
  // few seconds. Also doubles as the user gesture that unlocks audio.
  const introScreen = document.getElementById('introScreen');

  // Render the intro prompt with the same Asteroids vector font used
  // throughout the rest of the game.
  const introPromptCanvas = document.getElementById('introPrompt');
  if (introPromptCanvas) {
    const ipCtx = introPromptCanvas.getContext('2d');
    drawVectorText(ipCtx, 'TAP TO START', introPromptCanvas.width / 2, 24, 1.5, {
      color: '#f5f5f5', align: 'center', glow: 2, lineWidth: 2
    });
  }

  function dismissIntro(){
    if (!introScreen || introScreen.classList.contains('hidden')) return;
    introScreen.classList.add('hidden');
    ensureAudio();
  }
  if (introScreen) {
    introScreen.addEventListener('click', dismissIntro);
    introScreen.addEventListener('touchstart', (e) => { e.preventDefault(); dismissIntro(); }, { passive: false });
    window.addEventListener('keydown', () => dismissIntro());
    setTimeout(dismissIntro, 4000);
  }

  loop();
})();
</script>
</body>
</html>
