    "You came from that direction? Then you've already seen it.",
    "Some things are better left without a name.",
    "If you hear singing, keep flying.",
    "You should not be able to see that from here."
  ];
  let stationShopLine = '';
  function currentPageUpgrades() {
    const start = stationShopPage * SHOP_PAGE_SIZE;
    return UPGRADES.slice(start, start + SHOP_PAGE_SIZE);
  }
  function totalShopPages() {
    return Math.ceil(UPGRADES.length / SHOP_PAGE_SIZE);
  }

  // CSS px per canvas px, so hit boxes can grow to 44 CSS px on small screens.
  function cssScale() {
    const r = canvas.getBoundingClientRect();
    return r.width && W ? r.width / W : 1;
  }
  function touchRect(r) {
    const min = 44 / cssScale();
    const w = Math.max(r.w, min), h = Math.max(r.h, min);
    return { x: r.x - (w - r.w) / 2, y: r.y - (h - r.h) / 2, w, h };
  }
  function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

  function shopGeom() { return CP.shopLayout(W, H, UI_SCALE); }
  function shopCardRects() {
    const L = shopGeom();
    return currentPageUpgrades().map((u, i) => Object.assign({ upgrade: u }, L.cards[i]));
  }
  function shopGridTopY() { return shopGeom().top; }
  function shopLeaveRect() { return shopGeom().leave; }
  function shopPageArrowRects() {
    const L = shopGeom();
    const topY = L.top;
    const c0 = L.cards[0], c3 = L.cards[3];
    const gridH = c3.y + c3.h - topY;
    const gridHalfW = (c3.x + c3.w - c0.x) / 2;
    // At least 44 CSS px wide, however far the canvas is scaled down.
    const w = Math.max(Math.min(70 * UI_SCALE, W * 0.12), 44 / cssScale());
    const h = gridH;
    const desiredGap = 40 * UI_SCALE; // stay close to the grid on wide/desktop screens
    const margin = 6 * UI_SCALE;      // but never get pushed off-screen on narrow ones

    let prevX = W/2 - gridHalfW - desiredGap - w;
    let nextX = W/2 + gridHalfW + desiredGap;
    prevX = Math.max(margin, prevX);
    nextX = Math.min(W - margin - w, nextX);

    return {
      prev: { x: prevX, y: topY, w, h },
      next: { x: nextX, y: topY, w, h }
    };
  }

  // Short names for "needs" labels, so every lock label fits one card row.
  const UPGRADE_SHORT = { homing: 'MISSILE', homing2: 'MISSILE II', drone: 'DRONE', drone2: 'DRONE II' };
  function upgradeView(u) {
    const cost = upgradeCost(u);
    let lockLabel;
    if (cost === null) {
      if (u.type === 'onetime') {
        if (u.owned) lockLabel = 'OWNED';
        else if (u.requires && !upgradeIsOwned(u.requires)) lockLabel = 'NEEDS ' + (UPGRADE_SHORT[u.requires] || findUpgrade(u.requires).name);
        else lockLabel = 'OWNED';
      }
      else if (u.level >= u.maxLevel) lockLabel = 'MAX LEVEL';
      else lockLabel = 'NEXT VISIT';
    }
    const name = u.type === 'stackable' && u.level > 0 ? u.name + ' LV' + u.level : u.name;
    return { name, desc: u.describe(u), cost, lockLabel, icon: u.icon };
  }

  function drawShopUI() {
    const a = stationShopFadeT;
    if (a <= 0.01) return;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = COLORS.scrimShop;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // same spot/style as normal play
    CP.drawCurrency(ctx, shell.hudRight(W, UI_SCALE), 34 * UI_SCALE, currency, UI_SCALE);

    const L = shopGeom();
    const pages = totalShopPages();
    const pageLabelY = L.top - 14 * UI_SCALE;

    // The station keeper's one line, wrapped to the screen, ending above the page label.
    if (stationShopLine) {
      const size = 1.0 * UI_SCALE;
      const rows = CP.wrapVectorText(stationShopLine.toUpperCase(), size, W - 40 * UI_SCALE);
      const lineH = 12 * size + 10 * UI_SCALE;
      let y = (pages > 1 ? pageLabelY - 28 * UI_SCALE : L.top - 20 * UI_SCALE) - (rows.length - 1) * lineH;
      ctx.save();
      ctx.globalAlpha = a;
      for (const row of rows) {
        vtext(row, W / 2, y, size, { align: 'center', color: COLORS.ink, lineWidth: 2, glow: 4 });
        y += lineH;
      }
      ctx.restore();
    }

    const pageItems = currentPageUpgrades();
    shopCardRects().forEach((card, i) => {
      const v = upgradeView(card.upgrade);
      CP.drawShopCard(ctx, card, v, { currency, selected: i === stationSelectedCard, uiScale: UI_SCALE, fade: a });
    });

    // page arrows + indicator
    if (pages > 1) {
      const arrows = shopPageArrowRects();
      ctx.save();
      ctx.globalAlpha = a;
      CP.drawPageArrow(ctx, arrows.prev, -1, stationSelectedCard === pageItems.length + 1);
      CP.drawPageArrow(ctx, arrows.next, 1, stationSelectedCard === pageItems.length + 2);
      vtext('PAGE ' + (stationShopPage + 1) + '/' + pages, W / 2, pageLabelY, 0.75 * UI_SCALE,
        { align: 'center', color: COLORS.inkMuted, glow: 0 });
      ctx.restore();
    }

    const lv = L.leave;
    ctx.save();
    ctx.globalAlpha = a;
    CP.drawShopButton(ctx, lv, 'LEAVE', stationSelectedCard === pageItems.length, UI_SCALE);
    ctx.restore();

    if (stationShopMessageTimer > 0 && stationShopMessage) {
      const msgAlpha = Math.min(1, stationShopMessageTimer / 30) * a;
      const short = stationShopMessage === 'NOT ENOUGH CURRENCY';
      const size = 1 * UI_SCALE;
      const rows = CP.wrapVectorText(stationShopMessage, size, W - 32 * UI_SCALE);
      ctx.save();
      ctx.globalAlpha = msgAlpha;
      rows.forEach((row, i) => vtext(row, W / 2, lv.y + lv.h + 40 * UI_SCALE + i * 22 * UI_SCALE, size,
        { align: 'center', color: short ? COLORS.alert : COLORS.ink }));
      ctx.restore();
    }
  }

  function changeShopPage(delta) {
    const pages = totalShopPages();
    stationShopPage = (stationShopPage + delta + pages) % pages;
    stationSelectedCard = 0;
    say('Page ' + (stationShopPage + 1) + ' of ' + pages + '.');
  }

  function handleShopClick(x, y) {
    if (stationShopFadeT < 0.8) return;
    if (totalShopPages() > 1) {
      const arrows = shopPageArrowRects();
      if (inRect(x, y, touchRect(arrows.prev))) { changeShopPage(-1); return; }
      if (inRect(x, y, touchRect(arrows.next))) { changeShopPage(1); return; }
    }
    const rects = shopCardRects();
    for (let i = 0; i < rects.length; i++) {
      const card = rects[i];
      if (inRect(x, y, card)) {
        stationSelectedCard = i;
        purchaseUpgrade(card.upgrade);
        return;
      }
    }
    if (inRect(x, y, touchRect(shopLeaveRect()))) {
      stationSelectedCard = currentPageUpgrades().length;
      leaveStationShop();
    }
  }

  function leaveStationShop() {
    station = null;
    dockingResultText = '';
    say('Leaving the station.');

    state = 'levelstart';
    stateTimer = LEVEL_TRANSITION_FRAMES;
    transitionShip = { startX: ship.x, startY: ship.y, startAngle: ship.angle };
    ship.vx = 0;
    ship.vy = 0;
    ship.scale = 1;
    warpIntensity = 0;
    particles = [];
    trail = [];
    levelSpawnedThisTransition = false;
    activeBuff = null;
    warpStreaks = [];
    warpSpawnAccumulator = 3;
    bullets = [];
    saucerBullets = [];
    pickups = [];
    missiles = [];
    pendingStationVisit = false; // startLevel() runs at the normal point in the levelstart sequence
  }
  // ---------- Draw ----------
  // The field shows from the first start until the run ends (and frozen
  // behind PAUSED); title and result screens sit on empty space, as before.
  let fieldVisible = false;

  function draw() {
    ctx.fillStyle = sky.color();
    ctx.fillRect(0, 0, W, H);
    const focus = fieldVisible && ship;
    scopeGrid.draw(ctx, W, H, focus ? ship.x : undefined, focus ? ship.y : undefined);
    drawStars();

    if (fieldVisible) {
      if (state === 'levelstart' && !CP.motionReduced()) {
        drawWarpStreaks(warpIntensity);
      }

      if (state === 'playing' || state === 'levelstart' || state === 'gameover') {
        drawTrail();
        if (state !== 'gameover') drawShip();
        drawDrones();
        for (const a of asteroids) drawAsteroid(a);
        drawBullets(bullets);
        drawBullets(saucerBullets, '255,59,59');
        drawMissiles();
        drawParticles();
        drawPickups();
        drawSaucer();
      }

      if (state === 'approaching' || state === 'docked' || state === 'shop') {
        if (state === 'approaching') drawStationEngineSmoke();
        drawSpaceStation(station.x, station.y, station.width, station.angle, stationColor(), station.alpha);
        if (state === 'approaching') drawStationOpeningMarker();
        drawShip();
      }
    }

    CP.drawVignette(ctx, W, H);
    CP.drawPlayAreaBoundary(ctx, W, H);

    if (fieldVisible && (state === 'playing' || state === 'levelstart' || state === 'approaching')) {
      drawGameHud();
    }

    if (fieldVisible && state === 'docked' && dockingResultText) {
      vtext(dockingResultText, 20 * UI_SCALE, H - 30 * UI_SCALE, 1.4 * UI_SCALE,
        { color: COLORS.signal, glow: 6 });
    }

    if (fieldVisible && state === 'shop') {
      drawShopUI();
      // The shop is busy: dim it under the shell's own screens so their text reads.
      if (!shell.isPlaying() && shell.state !== 'settings') {
        ctx.fillStyle = COLORS.scrim;
        ctx.fillRect(0, 0, W, H);
      }
    }
  }

  // ---------- Main loop ----------
  function updateHeartbeat() {
    heartbeatTimer--;
    if (heartbeatTimer <= 0) {
      if (heartbeatToggle) sfx.heartbeat1(); else sfx.heartbeat2();
      heartbeatToggle = !heartbeatToggle;

      const remainingRatio = initialAsteroidCount > 0
        ? asteroids.length / initialAsteroidCount
        : 1;
      let frames = HEARTBEAT_MIN_FRAMES + (HEARTBEAT_MAX_FRAMES - HEARTBEAT_MIN_FRAMES) * remainingRatio;
      if (saucer) frames *= 0.6; // extra tension while the saucer is around
      heartbeatTimer = Math.max(HEARTBEAT_MIN_FRAMES, Math.round(frames));
    }
  }

  // One step is one 60fps frame of the original game. Steps are paid for
  // with shell.tick time, so pause stops them and GAME SPEED slows them.
  function step() {
    updateStars();
    sky.update(level);
    if (state === 'playing') {
      updateShip();
      updateBullets(bullets);
      updateBullets(saucerBullets);
      updateAsteroids();
      resolveDustInteractions();
      updateParticles();
      updateTrail();
      updatePickups();
      updateMissiles();
      updateDrones();
      maybeSpawnSaucer();
      updateSaucer();
      checkCollisions();
      if (state !== 'playing') return; // the ship was lost for good, or the wave was cleared
      updateHeartbeat();
      if (activeBuff) {
        activeBuff.timer--;
        if (activeBuff.timer <= 0) { activeBuff = null; say('Power-up over.'); }
      }
    } else if (state === 'levelstart') {
      stopThrustSound();

      const t = Math.min(1, Math.max(0, 1 - stateTimer / LEVEL_TRANSITION_FRAMES));
      const half = WARP_FADE_START;

      // two phases: (1) fly to center + build up speed/shrink, (2) already
      // centered, decelerate and let the streaks fade + ship grow back out
      let posT, decayT;
      if (t <= half) {
        posT = smoothstep(t / half);
        decayT = 0;
        warpIntensity = posT;
      } else {
        posT = 1;
        decayT = smoothstep((t - half) / (1 - half));
        warpIntensity = 1 - decayT;
      }

      if (transitionShip && ship) {
        ship.x = lerp(transitionShip.startX, W/2, posT);
        ship.y = lerp(transitionShip.startY, H/2, posT);
        ship.angle = lerpAngle(transitionShip.startAngle, -Math.PI/2, posT);
        ship.scale = t <= half
          ? lerp(1, WARP_SHIP_MIN_SCALE, posT)
          : lerp(WARP_SHIP_MIN_SCALE, 1, decayT);
      }
      // Reduced motion: no hyperspace streaks (the ship still flies to centre).
      if (CP.motionReduced()) warpStreaks.length = 0;
      else updateWarpStreaks(warpIntensity);

      if (!levelSpawnedThisTransition && t >= WARP_ASTEROID_SPAWN_T) {
        if (!pendingStationVisit) startLevel();
        levelSpawnedThisTransition = true;
      }
      updateAsteroids();

      updateParticles();
      updateTrail();
      stateTimer--;
      if (stateTimer <= 0) {
        transitionShip = null;
        warpIntensity = 0;
        ship.scale = 1;
        if (pendingStationVisit) {
          pendingStationVisit = false;
          state = 'approaching';
          beginStationApproach();
          say('A station is ahead. Fly into a lit dock to trade.');
        } else {
          state = 'playing';
          say('Wave ' + pad2(level) + '.');
        }
      }
    } else if (state === 'approaching') {
      updateStationArrival();
      updateStationEnginePush();
      updateShip();
      checkStationHullCollision();
      checkStationDocking();
      updateStationEngineSmoke();
    } else if (state === 'docked') {
      stopThrustSound();
      station.angle += STATION_SPIN_RATE * STATION_SPIN_MULTIPLIER;
      if (stationDockFadeT < 1) {
        stationDockFadeT = Math.min(1, stationDockFadeT + 0.02);
      } else {
        state = 'shop';
        stationShopFadeT = 0;
        say('Station shop. You have ' + currency + ' to spend. Arrows choose, ' +
          shell.keyFor('fire').toLowerCase() + ' or enter buys.');
      }
    } else if (state === 'shop') {
      station.angle += STATION_SPIN_RATE * STATION_SPIN_MULTIPLIER;
      station.alpha = Math.max(0, 1 - stationShopFadeT);
      if (stationShopFadeT < 1) stationShopFadeT = Math.min(1, stationShopFadeT + 0.035);
      if (stationShopMessageTimer > 0 && !shell.messagesStay()) stationShopMessageTimer--;
    }
  }

  // ---------- Hyperspace (one press; was Shift) ----------
  function hyperspace() {
    if (!ship || (state !== 'playing' && state !== 'approaching')) return;
    if (ship.hyperCooldown > 0) return;
    sfx.hyperspace();
    ship.x = rand(0, W);
    ship.y = rand(0, H);
    ship.vx = 0; ship.vy = 0;
    ship.hyperCooldown = 60;
    ship.invincible = 60;
  }

  // ---------- Shell: the frame around the game ----------
  const sky = CP.createHueSky(); // space-hue-start, +60 every three waves
  let stepAcc = 0;

  shell = CP.createShell({
    id: 'cp-asteroids',
    canvas,
    layout: 'wide',
    title: 'ASTEROIDS',
    howTo: ['SHOOT ROCKS AND SAUCERS', 'GATHER DUST FOR POWER, SQUARES TO SPEND', 'EVERY 4 WAVES, DOCK AT THE STATION'],
    actions: [
      { id: 'left', label: 'TURN LEFT', keys: ['arrowleft'], hold: true, group: 'turn' },
      { id: 'right', label: 'TURN RIGHT', keys: ['arrowright'], hold: true, group: 'turn' },
      { id: 'thrust', label: 'THRUST', keys: ['arrowup'], hold: true },
      { id: 'fire', label: 'FIRE', keys: [' '], hold: true },
      { id: 'hyper', label: 'HYPERSPACE', keys: ['arrowdown'] },
      { id: 'drag', label: 'STEER, UP THRUSTS, CIRCLE FIRES', display: 'DRAG', fixed: true }
    ],
    onAction: (id) => { if (id === 'hyper') hyperspace(); },
    steering: true,
    synth: syn,
    intro: true,
    onStart: () => {
      resetGame();
      state = 'playing';
      fieldVisible = true;
      stepAcc = 0;
      dragPointers.clear();
      recomputeDragInputs();
      say('Wave 01. ' + lives + ' ships.');
    },
    onPause: () => { stopThrustSound(); dragPointers.clear(); recomputeDragInputs(); },
    onEnd: () => { stopThrustSound(); fieldVisible = false; dragPointers.clear(); recomputeDragInputs(); },
    onMute: (muted) => { if (muted) stopThrustSound(); }
  });

  function frame(now) {
    const dt = shell.tick(now);
    if (dt) {
      stepAcc = Math.min(stepAcc + dt * 60, 4);
      while (stepAcc >= 0.999 && shell.isPlaying()) {
        step();
        stepAcc -= 1;
      }
    }
    if (!shell.isPlaying()) stopThrustSound();
    if (shell.isPlaying()) shell.setScore(score);
    draw();
    shell.draw(ctx, W, H, UI_SCALE);
    requestAnimationFrame(frame);
  }

  resizeCanvas();
  requestAnimationFrame(frame);
})();
</script>
