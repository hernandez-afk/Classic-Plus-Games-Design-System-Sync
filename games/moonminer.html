<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MOON MINER</title>
<link rel="stylesheet" href="../kit/tokens.css">
<link rel="stylesheet" href="../kit/bundle.css">
<style>
  :root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark; }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--void); }
  body { touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #c { position:fixed; top:0; left:0; width:100%; height:100%; display:block; outline:none; touch-action:none; }
  #safe { position:fixed; top:0; left:0; visibility:hidden; pointer-events:none;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); }
</style>
</head>
<body>
<canvas id="c" aria-label="Moon Miner playfield"></canvas>
<div id="safe"></div>
<script src="../kit/bundle.js"></script>
<script>
(function(){
'use strict';
// ---------- tokens ----------
// Kit colours with their meanings: ink = the lander and neutral matter, signal = the player's side
// powered up (fuel, crystals, selection), coin = credits only, hostile = enemies only, alert = a mistake
// or a clock running out. The gem / pad ladder keeps the brick colours (yellow 1 .. red 4), always with a
// second cue (X2..X5 labels, gem marks).
const CP = window.ClassicPlus, K = CP.COLORS;
const C = { ink:K.ink, muted:'#9a9a9a', smoke:'#4a4a4a', blue:K.signal, red:K.brickRed, orange:K.brickOrange, green:K.brickGreen,
  yellow:K.brickYellow, coin:K.coin, hostile:K.hostile, alert:K.alert, inkMuted:K.inkMuted,
  faint:K.inkFaint, gemRed:K.brickCracked };
// colour is meaning: red is worth the most, yellow the least (and every pad says X2..X5 too). The top rung is
// `brick-cracked` (the ladder's raspberry red): `brick-red` is only 4.0:1 on the hue sky, under 4.5:1 for the
// X5 label and the +points text; `brick-cracked` keeps 4.6:1 on every hue. C.red stays for lava and the slot 7.
const MULT_COL = { 2:C.yellow, 3:C.green, 4:C.orange, 5:C.gemRed };
// pad labels and the landing message: the ladder colour, except X5 in ink. Right under its bright pad bar the
// phosphor bloom lifts the hue sky enough that no kit red keeps 4.5:1 there (brick-cracked fell to 3.2:1).
const LABEL_COL = { 2:C.yellow, 3:C.green, 4:C.orange, 5:C.ink };
// phosphor bloom strengths. Measured on rendered frames (bloom only adds light, but it lifts the ground beside a
// stroke more than the stroke itself, which is already near white): at 0.42 / 0.55 ink text fell to 3.2:1 against
// its own halo and the lander in the raid beam to 1:1. At these values every text stroke keeps 4.5:1 and every
// object 3:1 against the bloom-lit ground around it.
const GLOW = { tight:0.17, wide:0.22 };
let UI = 1;                                             // HUD / text scale (the 0.75 text floor is 0.75*UI)
let VW = 1e9;                                           // width text may wrap to (the playfield column)

// ---------- vector font (the kit's) ----------
// vtext keeps the game's call shape but draws with ClassicPlus.drawVectorText. Text never goes below the
// 0.75 floor; centred text wider than the column wraps onto further rows (it never shrinks).
function vtext(ctx, str, x, y, size, o){
  o = o || {}; str = String(str).toUpperCase();
  const floor = o.world ? 0 : 0.75*UI;
  let s = Math.max(size, floor);
  const opts = { color:o.color || C.ink, align:o.align || 'left', glow:o.glow || 0, lineWidth:Math.max(o.lw || 2, o.world ? 0 : 1.4), glowScale:1 };
  ctx.save(); ctx.globalAlpha *= (o.alpha == null ? 1 : o.alpha);
  const maxW = Math.min(W - 24, VW);
  if (!o.world && o.align === 'center' && CP.inkWidth(str, s) > maxW && str.indexOf(' ') > 0){
    const rows = CP.wrapVectorText(str, s, maxW);
    rows.forEach((r, i) => CP.drawVectorText(ctx, r, x, y + i*(12*s + 8), s, opts));
  } else CP.drawVectorText(ctx, str, x, y, s, opts);
  ctx.restore();
  return s;
}
// rows a centred vtext line takes once wrapped to the column (for stacking lines under it)
const rowsH = (text, size) => { const s2 = Math.max(size, 0.75*UI); return CP.wrapVectorText(String(text), s2, Math.min(W - 24, VW)).length * (12*s2 + 8); };
// blinking at `rate` toggles a second (rate 4 = 2 flashes a second); held steady under reduced motion
const blink = (t, rate) => CP.motionReduced() || Math.floor(t*rate) % 2 === 0;
// a repeatable jitter in -1..1 from a number (used instead of Math.random in drawing, so a paused frame holds still)
const jit = n => { const v = Math.sin(n*12.9898 + 78.233)*43758.5453; return (v - Math.floor(v))*2 - 1; };
let shx = 0, shy = 0, lastFlashT = -9;
// full-field flashes: at most one every 0.34s, drawn under 10% alpha and fading; none under reduced motion
function setFlash(v){ if (CP.motionReduced() || gclock - lastFlashT < 0.34) return; lastFlashT = gclock; flash = Math.max(flash, v); }
// screen-reader announcements for the game's own events (the shell announces start, pause, sound and results)
// The game's own events go through the shell's live region.
function say(text){ if (shell && text) shell.say(text); }
// MESSAGES: STAY. A timed message asks gate(id) once its own timer has run out; under STAY the gate stays
// shut until the player's next key or tap, otherwise it opens at once. resetGate(id) re-arms it.
const gates = {};
function gate(id){
  const g = gates[id] || (gates[id] = { t:gclock, done:false });
  if (!shell.messagesStay() || lastInputT > g.t) g.done = true;
  return g.done;
}
const held = id => !gate(id);
const resetGate = id => { delete gates[id]; };
const waiting = id => !!(gates[id] && !gates[id].done);
// gems: the colour ladder (yellow 10, green 20, orange 40, red 80) plus a second cue in the marks inside:
// none, a dot, a bar, an inner diamond
const GEM_RANK = { yellow:0, green:1, orange:2, red:3 };
function drawGem(x, y, kind, r, lw, fill){
  const rank = GEM_RANK[kind] || 0, col = GEM_COL[kind] || C.ink;
  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = lw || 1.6; ctx.lineJoin = 'miter';
  ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r*0.8, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r*0.8, y); ctx.closePath();
  if (fill) ctx.fill(); ctx.stroke();
  if (!fill){
    if (rank === 1){ const z = Math.max(r*0.3, ctx.lineWidth); ctx.fillRect(x - z/2, y - z/2, z, z); }
    else if (rank === 2){ ctx.beginPath(); ctx.moveTo(x - r*0.45, y); ctx.lineTo(x + r*0.45, y); ctx.stroke(); }
    else if (rank === 3){ const q = r*0.42; ctx.beginPath(); ctx.moveTo(x, y - q); ctx.lineTo(x + q*0.8, y); ctx.lineTo(x, y + q); ctx.lineTo(x - q*0.8, y); ctx.closePath(); ctx.stroke(); }
  }
  ctx.restore();
}
const textW = (s, size) => String(s).length*12*size - 4*size;
const pad6 = n => String(Math.max(0, Math.floor(n))).padStart(6,'0');
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const rnd = (a,b) => a + Math.random()*(b-a);

// ---------- canvas & layout ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const probe = document.getElementById('safe');
const GL = [0,1,2].map(() => { const c = document.createElement('canvas'); return { c, x:c.getContext('2d') }; });
const WH = 900, FIELD_W = 470;                          // world size in units: a portrait playfield
let FX = 0;                                              // screen x where the playfield column starts
let W=0, H=0, D=1, safe={t:0,r:0,b:0,l:0}, touch=false, bandH=0, viewH=0, k=1, WW=1000;

function readSafe(){
  const s = getComputedStyle(probe);
  safe = { t:parseFloat(s.paddingTop)||0, r:parseFloat(s.paddingRight)||0, b:parseFloat(s.paddingBottom)||0, l:parseFloat(s.paddingLeft)||0 };
}
function resize(){
  readSafe();
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight); D = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W*D); cv.height = Math.round(H*D);
  GL.forEach((g,i) => { const f = 2 << i; g.c.width = Math.max(1, Math.round(cv.width/f)); g.c.height = Math.max(1, Math.round(cv.height/f)); });
  bandH = safe.b;
  viewH = Math.max(200, H - bandH);
  // FIXED PORTRAIT PLAYFIELD: the world is always FIELD_W x WH units on every screen (so every moon is
  // identical everywhere). It's scaled to fit, and on wide screens it sits centred with open space around it.
  k = Math.min(viewH / WH, W / FIELD_W);
  if (WW !== FIELD_W && pts.length && WW) rescaleWorld(FIELD_W / WW);
  WW = FIELD_W;
  FX = (W - WW*k) / 2;                                  // screen x where the playfield starts (0 on a phone)
  UI = clamp(Math.min(W/420, H/700), 1, 1.3);           // text and HUD scale: never below 1, so the 0.75 floor is a 9px cap
  VW = Math.max(240, W - 2*FX - 24, Math.min(W - 24, 440*UI));   // wrap width: the column, but never narrower than a phone
  sizeStation();
  buildStars();
}
function enableTouch(){
  if (touch) return; touch = true; resize();   // drag controller: no button band
}

// ---------- world ----------
let pts = [], pads = [], stars = [], parts = [];
function rescaleWorld(r){
  pts.forEach(p => p[0] *= r); pads.forEach(p => { p.x0 *= r; p.x1 *= r; (p.gems||[]).forEach(g => g.x *= r); (p.rocks||[]).forEach(q => q.x *= r); (p.tunnel||[]).forEach(t => t[0] *= r); (p.crystals||[]).forEach(c => c.x *= r); });
  ST.x *= r;
  volcanoes.forEach(v => v.x *= r); lava.forEach(b => b.x *= r); saucers.forEach(sc => sc.x *= r); bugs.forEach(b => b.x *= r); vfx.forEach(f => f.x *= r);
  pads.forEach(p => (p.eggs || []).forEach(e => e.x *= r));
  stars.forEach(s => s.x *= r); parts.forEach(p => p.x *= r); L.x *= r;
}
function groundAt(x){
  if (!pts.length) return WH;
  if (x <= pts[0][0]) return pts[0][1];
  for (let i=1;i<pts.length;i++){
    if (x <= pts[i][0]){ const a = pts[i-1], b = pts[i]; const t = (x-a[0]) / ((b[0]-a[0]) || 1); return a[1] + (b[1]-a[1])*t; }
  }
  return pts[pts.length-1][1];
}
// ---------- space station ----------
const ST = { x:500, hw:180, yb:70, beam:240, bw:17, notch:17 };   // beam half-width matches the exit
function sizeStation(){ ST.hw = WW < 600 ? Math.max(70, WW*0.18) : Math.min(WW*0.24, 190); }
function placeStation(){ ST.x = WW < 600 ? WW/2 : WW*rnd(0.38, 0.62); sizeStation(); }
function inStation(x, y){
  return x > ST.x - ST.hw && x < ST.x + ST.hw && y < ST.yb && !(Math.abs(x - ST.x) < ST.notch && y > ST.yb - 12);
}
// ---------- LEVEL RULES (progression mode) ----------
// Each moon is a fixed layout (seeded), one tank of fuel, and a gem-value QUOTA. Reach the quota and the
// tractor beam switches on, reaching down to the ground. Crash or run dry and the moon restarts.
const QUOTA_SHARE = 0.2;                                // quota = this share of all the gem value buried on the moon
let quota = 0, levelSeed = 1, failT = 0, quotaAnnounced = false, quotaT = 99;

const cargoValue = () => cargo.reduce((a, g) => a + g.v, 0);
let mission = 'moon', rescue = null;                   // 'moon' (dig for a quota) or 'rescue' (wreck with survivors)
const RESCUE_PERSON = 80;                               // credits per survivor brought home
// rescue: the beam is open as soon as you've reached the wreck; you dock whenever you've salvaged enough
const rescueValue = () => rescue ? rescue.saved*RESCUE_PERSON + cargoValue() : 0;
const rescueStars = () => { const k = rescue && rescue.worth ? rescueValue()/rescue.worth : 0; return k >= 0.9 ? 3 : k >= 0.6 ? 2 : k >= 0.3 ? 1 : 0; };
const quotaMet = () => mission === 'casino' ? true : mission === 'rescue' ? !!rescue && rescue.reached : quota > 0 && cargoValue() >= quota;
const beamOn = () => quotaMet();
// normal length: you fly up to it when you're done, so it never grabs you while you're still working the sites
const beamLen = () => state === 'raid' ? RAID_BEAM() : ST.beam;
function seeded(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function withSeed(seed, fn){ const orig = Math.random; Math.random = seeded(seed); try { fn(); } finally { Math.random = orig; } }
function buildLevel(){                                  // same moon = same terrain, pads, hazards and buried gems
  if (mission === 'casino'){
    withSeed(levelSeed, () => { genTerrain(); pads = []; volcanoes = []; lava = []; vfx = []; saucers = []; buildCasinoStation(); });
    pts = [[0, WH + 260], [WW, WH + 260]];               // open space: nothing below but the drop
    gems = []; rocks = []; quota = 1; hazT = 0; return;
  }
  if (mission === 'rescue'){ withSeed(levelSeed, () => { genTerrain(); pads = []; volcanoes = []; lava = []; vfx = []; buildWreck(); }); gems = []; rocks = []; quota = 1; hazT = 0; return; }
  withSeed(levelSeed, () => { genTerrain(); for (const p of pads) seedDeposits(p); });
  gems = []; rocks = [];
  const total = pads.reduce((a, p) => a + p.gems.reduce((b, g) => b + GEM_VAL[g.kind]*p.mult, 0), 0);
  quota = Math.max(300, Math.round(total * QUOTA_SHARE / 50) * 50);
  hazT = 0;
}
function startLevel(node){
  mission = 'moon'; rescue = null;
  wave = node.level; levelSeed = node.level*9973 + 17; mapPos = node;
  restartLevel(true);
}
function startCasinoTrip(node){                        // fly down to the Lucky Star, land on its deck, play, fly home
  mission = 'casino';
  wave = node.level; levelSeed = node.level*4441 + 77; mapPos = node;
  restartLevel(true);
}
function startRescue(node){
  mission = 'rescue';
  wave = node.level; levelSeed = node.level*6007 + 911; mapPos = node;
  restartLevel(true);
}
function restartLevel(first){
  buildLevel(); cargo = []; parts = []; floaters = []; rings = []; lava = []; bugs = []; drillBroken = false;
  quotaAnnounced = false; failT = 0; fuel = FUELMAX; newRound();
  if (!first){ msg = ''; }
}
const inBeam = () => Math.abs(L.x - ST.x) < ST.bw && L.y > ST.yb && L.y < ST.yb + beamLen();
function genTerrain(){
  placeStation();
  // how many dig sites: moon 1 has one easy wide pad, moon 2 two, then 1-3 varying (seeded, so fixed per moon)
  const n = wave <= 1 ? 1 : wave <= 3 ? 2 : [1, 2, 3, 3, 2, 3, 3][Math.floor(Math.random()*7)];
  const mults = wave <= 1 ? [3] : [2,3,4,5].sort(() => Math.random()-0.5).slice(0, n);
  const shrink = Math.max(0.72, 1 - (wave-1)*0.04);
  const baseW = { 2:74, 3:56, 4:44, 5:36 };
  const slotW = (WW - 40) / n;
  pads = mults.map((m, i) => {
    const w = Math.max(30, baseW[m]*shrink) * (wave <= 1 ? 1.4 : 1);   // the first pad is extra wide
    const s0 = 20 + i*slotW + 12, s1 = 20 + (i+1)*slotW - 12 - w;
    const x0 = s1 > s0 ? rnd(s0, s1) : s0;
    return { x0, x1:x0+w, y:rnd(560, 830), mult:m };
  });
  // rolling hills: alternate up and down, then round every corner (pads stay flat)
  const chaikin = (run) => {
    for (let it=0; it<3; it++){
      const out = [run[0]];
      for (let i=0;i<run.length-1;i++){
        const a = run[i], b = run[i+1];
        out.push([a[0]*0.75 + b[0]*0.25, a[1]*0.75 + b[1]*0.25], [a[0]*0.25 + b[0]*0.75, a[1]*0.25 + b[1]*0.75]);
      }
      out.push(run[run.length-1]); run = out;
    }
    return run;
  };
  const hillRun = (x0, y0, x1, y1) => {
    const run = [[x0, y0]];
    let x = x0, y = y0, dir = Math.random() < 0.5 ? -1 : 1;
    while (x1 - x > 70){
      x = Math.min(x1 - 30, x + rnd(55, 110));
      y = clamp(y + dir*rnd(50, 150), 380, 870); dir = -dir;
      if (x1 - x < 110) y = lerp(y, y1, 0.6);
      run.push([x, y]);
    }
    run.push([x1, y1]);
    return chaikin(run);
  };
  pts = [];
  let cx = 0, cy = rnd(500, 820);
  for (const p of pads){
    const r = hillRun(cx, cy, p.x0, p.y);
    if (pts.length) r.shift();
    pts.push(...r, [p.x1, p.y]);
    cx = p.x1; cy = p.y;
  }
  const tail = hillRun(cx, cy, WW, rnd(500, 820)); tail.shift(); pts.push(...tail);
  placeVolcano(); placeSaucer();
  stars = [];
  for (let i=0;i<Math.round(WW/10);i++){
    const sx = rnd(0, WW), g = groundAt(sx);
    const sy = rnd(10, g - 40); if (inStation(sx, sy) || (Math.abs(sx - ST.x) < ST.hw && sy < ST.yb + 20)) continue;
    stars.push({ x:sx, y:sy, s:Math.random() < 0.2 ? 2 : 1, a:rnd(0.2, 0.6) });
  }
}

// ---------- hazards ----------
// VOLCANO: a small cone beside one of the better pads, erupting on a fixed 6 s cycle
// (quiet, rumble, erupt) so the player can learn the timing.
let volcanoes = [], lava = [], saucers = [], bugs = [], hazT = 0, vfx = [];   // vfx: harmless crater bubbles and drips
const VOLC = { cycle:6, rumble:3.4, erupt:4.4 };
const LAVA_HOT = 0.9;                                  // seconds a blob stays dangerous
const lavaHot = b => b.age < LAVA_HOT;
// ALERT NEVER SHARES A SCREEN WITH HOSTILE. While anything hostile is (or is about to be) on screen - a raid,
// rival stops on the star map, saucers, volcanoes and their lava, eggs and bugs at the dig, red debris - a
// mistake or a running-out clock is drawn in ink and leans on its other cues instead (its words, the LOW
// label, blinking at 3 flashes a second or less). Hazards count for as long as the moon has them, so the
// colour doesn't flicker as a saucer leaves the screen or a volcano cools.
function hostileOnScreen(){
  if (state === 'raid') return true;
  if (state === 'map') return !!starMap && starMap.nodes.some(n => n.type === 'rival');   // only the chart is drawn
  if (saucers.length || volcanoes.length || lava.length || bugs.length) return true;
  if ((state === 'drill' || state === 'drilled') && drill.pad && (drill.pad.eggs || []).length) return true;
  return parts.some(p => p.col === C.hostile) || rings.some(r => r.col === C.hostile);
}
const mistakeColor = () => hostileOnScreen() ? C.ink : C.alert;
const mc = col => col === C.alert ? mistakeColor() : col;   // resolves a stored alert colour at draw time
// level plan: how many of each hazard a wave gets (wave 2 onward is the hard layout)
// hazards arrive gradually: saucers from moon 3, volcanoes from moon 4, doubled up from moons 6 / 7
const levelPlan = () => ({ volcanoes: wave < 4 ? 0 : wave < 7 ? 1 : 2, saucers: wave < 3 ? 0 : wave < 6 ? 1 : 2 });
function placeVolcano(){
  volcanoes = []; lava = []; vfx = [];
  const want = levelPlan().volcanoes, used = new Set();
  const byValue = pads.slice().sort((a, b) => b.mult - a.mult);
  for (let n = 0; n < want; n++){
    let placed = false;
    // prefer a different pad for each volcano; fall back to the other side of a used one
    for (const pad of byValue.filter(p => !used.has(p)).concat(byValue)){
      for (const side of Math.random() < 0.5 ? [-1, 1] : [1, -1]){
        const vx = side < 0 ? pad.x0 - rnd(32, 50) : pad.x1 + rnd(32, 50);
        if (vx < 30 || vx > WW - 30) continue;
        if (pads.some(q => vx + 24 > q.x0 && vx - 24 < q.x1)) continue;
        if (volcanoes.some(v => Math.abs(v.x - vx) < 60)) continue;
        if (Math.abs(vx - ST.x) < 30) continue;
        const gl = groundAt(vx - 22), gr = groundAt(vx + 22), top = Math.min(gl, gr, groundAt(vx)) - 30;
        pts = pts.filter(p => p[0] < vx - 22 || p[0] > vx + 22);
        pts = pts.concat([[vx - 22, gl], [vx - 6, top], [vx + 6, top], [vx + 22, gr]]).sort((a, b) => a[0] - b[0]);
        // each volcano runs the same cycle, offset so they don't erupt together
        volcanoes.push({ x:vx, top, pad, phase: n === 0 ? rnd(0, VOLC.cycle) : (volcanoes[0].phase + VOLC.cycle/2) % VOLC.cycle, state:'quiet' });
        used.add(pad); placed = true; break;
      }
      if (placed) break;
    }
  }
}
// SAUCERS: sweep across at fixed heights, pause off-screen, then sweep back.
// With two, they fly opposite ways at clearly different heights.
function placeSaucer(){
  const n = levelPlan().saucers, sp = 55 + wave*5;
  const y0 = rnd(240, 300);
  saucers = n > 0 ? [{ x:-40, y:y0, dir:1, speed:sp, wait:1.5 }] : [];
  if (n > 1) saucers.push({ x:WW + 40, y:y0 + rnd(90, 120), dir:-1, speed:sp*0.85, wait:1.5 });
}
function updateHazards(dt){
  hazT += dt;
  for (const v of volcanoes){
    const vt = (hazT + v.phase) % VOLC.cycle;
    v.state = vt < VOLC.rumble ? 'quiet' : vt < VOLC.erupt ? 'rumble' : 'erupt';
    if (v.state === 'erupt' && Math.random() < dt*26){
      const a = rnd(-0.5, 0.5), sp = rnd(105, 150);
      lava.push({ x:v.x + rnd(-4, 4), y:v.top - 2, vx:Math.sin(a)*sp, vy:-Math.cos(a)*sp, age:0, c:C.hostile });   // hot lava is an enemy: hostile
    }
    if (v.state === 'rumble' && Math.random() < dt*10)
      parts.push({ x:v.x + rnd(-5, 5), y:v.top - 2, vx:rnd(-8, 8), vy:-rnd(10, 25), life:0, max:rnd(0.4, 0.8), col:C.smoke, sz:2, g:0, fr:0.95 });
    // molten crater: bubbling lava in the mouth, drips down the sides
    const busy = v.state === 'quiet' ? 1 : v.state === 'rumble' ? 2.5 : 1.5;
    if (Math.random() < dt*14*busy) vfx.push({ k:'bub', v, x:v.x + rnd(-5, 5), y:v.top - 0.5, vy:-rnd(6, 16)*busy, life:0, c:[C.orange, C.red, C.yellow][(Math.random()*3)|0] });
    if (Math.random() < dt*1.6){ const side = Math.random() < 0.5 ? -1 : 1;

// Land on each platform to take the survivors aboard (and grab any salvage). All survivors aboard =

    if (up.canister) vtext(ctx, 'CANISTERS ' + up.canister, x0, cy2 + (mission === 'rescue' ? 3 : 1)*sl, sh, { color:C.blue, lw:1.5 });
  }
  if (state === 'ready' && blink(t, 1.6)){
    const rs = touch ? 'TAP TO RELEASE' : 'PRESS ' + keyLabel('dig') + ' TO RELEASE';
    vtext(ctx, rs, W/2, viewH*0.33, 0.9*UI, { align:'center', color:C.ink, lw:1.6 });
  }
  if ((quotaT < 2.6 || (quotaAnnounced && held('quota'))) && !raidOn){
    const k = quotaT < 2 || held('quota') ? 1 : 1 - (quotaT - 2)/0.6;
    bigCenter(mission === 'rescue' ? 'WRECK REACHED' : 'QUOTA MET', viewH*0.3, C.blue, 1.6);
    vtext(ctx, mission === 'rescue' ? 'SALVAGE WHAT YOU CAN - THE BEAM IS ON' : 'FLY UP TO THE TRACTOR BEAM WHEN READY', W/2, viewH*0.3 + 30, 0.8*UI, { align:'center', lw:1.5, alpha:k });
  }
  if (state === 'play'){
    if (fuel <= 0) { if (blink(t, 3)) vtext(ctx, 'OUT OF FUEL', W/2, viewH*0.26, 0.9*UI, { align:'center', color:mistakeColor(), glow:2, lw:1.8 }); }
    else if (lowF && (lowT < 3 || CP.motionReduced() || (t % 1.2) < 0.8)) bigCenter('LOW FUEL', viewH*0.26, mistakeColor(), 1.4);   // big, and keeps coming back while you're low
    const hint = mission === 'casino' ? (L.grounded || (cstation && cstation.visited) ? '' : 'LAND ON THE LUCKY STAR') : quotaMet() ? '' : mission === 'rescue' ? 'FLY DOWN TO THE WRECK' : 'DIG ' + quota + ' IN GEMS';
    if (hint && stateT < 0.2) resetGate('hint');
    if (hint && (stateT < (beamOn() ? 5 : 2.2) || held('hint')) && blink(stateT, 4)) vtext(ctx, hint, W/2, viewH*0.33, 0.8*UI, { align:'center', lw:1.5, color: beamOn() ? C.blue : C.ink });
  }
}
function drawMessage(){
  const y = viewH*0.32;
  bigCenter(msg, y, mc(msgCol), 1.7);
  if (msg2) vtext(ctx, msg2, W/2, y + 16 + 12*0.9, 0.9*UI, { align:'center', color: state === 'crashed' ? C.ink : state === 'docked' ? C.blue : state === 'drilled' && drill.found ? C.coin : C.ink, lw:1.8 });
}
function phosphor(){
  if (!cv.width || !cv.height || GL.some(g => !g.c.width || !g.c.height)) return;   // hidden / zero-size window: skip the glow pass
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  let src = cv;
  GL.forEach(g => { g.x.imageSmoothingEnabled = true; g.x.imageSmoothingQuality = 'high'; g.x.globalCompositeOperation = 'copy'; g.x.drawImage(src, 0, 0, g.c.width, g.c.height); src = g.c; });
  ctx.imageSmoothingEnabled = true; ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = GLOW.tight; ctx.drawImage(GL[1].c, 0, 0, cv.width, cv.height);
  ctx.globalAlpha = GLOW.wide; ctx.drawImage(GL[2].c, 0, 0, cv.width, cv.height);
  if (tipsy > 0 && !CP.motionReduced()){                   // seeing double: a drifting ghost of the whole frame (cut under reduced motion)
    const tt = tipsyT, dx = (Math.sin(tt*1.3)*14 + Math.sin(tt*3.1)*4) * tipsy * D, dy = Math.sin(tt*0.9)*5 * tipsy * D;
    ctx.globalAlpha = 0.45 * tipsy; ctx.drawImage(GL[0].c, dx, dy, cv.width, cv.height);
    ctx.globalAlpha = 0.25 * tipsy; ctx.drawImage(GL[1].c, -dx*0.6, -dy*0.6, cv.width, cv.height);
  }
  ctx.restore();
}

// ---------- shell ----------
// Title, how to play, settings, pause, sound, the result screen and restart all come from the kit's shell.
// A run is one life: crashing or failing a mission ends it on GAME OVER-style result screen; PLAY AGAIN
// retries that mission. The campaign itself (map, credits, upgrades) is saved as before.
function startRun(){
  score = 0; endInfo = null; pressQ = []; for (const k in gates) delete gates[k];
  tb.left = tb.right = tb.thrust = false; drag = null; btnPtr = null;
  tipsy = 0; hitStop = 0; shake = 0; flash = 0; shx = shy = 0;
  if (!starMap){ if (savedGame) continueGame(); else startGame(); }
  else if (state === 'raid' && raid){ ST.x = raid.homeX; raid = null; startRaid(); }
  else if (state === 'docked' && tally){ tallySkip(); tally = null; openShop(); }
  else if (state === 'docked' || state === 'shop' || state === 'map'){ tally = null; casino = null; cstation = null; mission = 'moon'; openMap(); }
  else { casino = null; restartLevel(); }
  armHolds();
}
shell = CP.createShell({
  id:'cp-moonminer', canvas:cv, layout:'column', title:'MOON MINER',
  howTo:['LAND SOFTLY ON A PAD, THEN DRILL FOR GEMS', 'DIG THE QUOTA, RIDE THE BEAM HOME', 'SPEND CREDITS, CHOOSE THE NEXT STOP'],
  actions:ACTIONS,
  onAction:id => { if (shell.isPlaying()){ lastInputT = gclock; pressQ.push(id); } },
  steering:true, timer:true, synth:syn, intro:true,
  buttons:hudButtons,
  onStart:startRun
});

// ---------- boot ----------
window.addEventListener('resize', resize);
resize();
genTerrain();
L.x = ST.x; L.y = 150; L.a = 0; L.alive = true;          // the lander hangs over the first moon behind the title
function frame(ts){
  if ((window.innerWidth !== W || window.innerHeight !== H) && window.innerWidth > 0 && window.innerHeight > 0) resize();   // recover after being shown at size 0
  const dt = shell.tick(ts);                             // game seconds: 0 unless playing, slowed by GAME SPEED
  audioInit();
  if (master) master.gain.value = masterLevel();
  if (dt) update(dt);
  if (!shell.isPlaying() && AC){                         // paused / title / result: the engine and drill fall silent
    if (thrustGain) thrustGain.gain.setTargetAtTime(0, AC.currentTime, 0.03);
    if (drillGain) drillGain.gain.setTargetAtTime(0, AC.currentTime, 0.02);
  }
  if (shell.isPlaying()) shell.setScore(Math.floor(score));
  render(gclock);
  ctx.setTransform(D, 0, 0, D, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  shell.draw(ctx, W, H, UI);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// test hook, only with ?test in the URL (used by the headless checks)
if (/[?&]test\b/.test(location.search)) window.__mm = {
  shell, get state(){ return state; }, get score(){ return score; }, get fuel(){ return fuel; }, get L(){ return L; }, get credits(){ return credits; },
  get gclock(){ return gclock; }, get pads(){ return pads; }, get drill(){ return drill; },
  set fuel(v){ fuel = v; }, get hostile(){ return hostileOnScreen(); }, get mistakeColor(){ return mistakeColor(); },
  moon(n){ const m = mapPos; startLevel({ level:n }); mapPos = m; },   // jump to moon n (hazards from moon 3)
  crash: r => crash(r || 'TEST'),
  go(name){
    if (name === 'shop'){ credits = 5000; openShop(); }
    else if (name === 'map') openMap();
    else if (name === 'casino'){ credits = 900; mission = 'casino'; openCasino(); }
    else if (name === 'raid'){ genTerrain(); startRaid(); }
    else if (name === 'rescue'){ startRescue({ level:3, type:'rescue' }); }
    else if (name === 'drill'){ const p = pads[0]; drill.pad = p; L.x = (p.x0 + p.x1)/2; L.y = p.y - 9; L.vx = L.vy = 0; L.a = 0; startDrill(); }
    else if (name === 'tally'){ cargo = [{ kind:'red', v:400 }, { kind:'green', v:60 }, { kind:'yellow', v:30 }]; pads.forEach(p => p.drilled = true); dock(); }
  }
};
})();
</script>
