<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Celestipede</title>
<link rel="stylesheet" href="../kit/tokens.css">
<link rel="stylesheet" href="../kit/bundle.css">
<style>
  :root {
    --bg-space: #141b2a;
    color-scheme: dark;
    background: var(--bg-space);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg-space: #141b2a; } }
  :root[data-theme="dark"] { --bg-space: #141b2a; }
  html { height: 100%; }
  body { height: 100%; margin: 0; background: var(--bg-space); overflow: hidden;
    font-family: var(--font-mono); -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; overscroll-behavior: none; }
  #wrap { position: fixed; inset: 0; overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
  #inner { position: relative; width: 100%; height: 100%; }
  canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.6) 100%); }
</style>
<script src="../kit/bundle.js"></script>
</head>
<body>
<div id="wrap"><div id="inner">
  <canvas id="c" tabindex="0" aria-label="Celestipede game field"></canvas>
  <div id="vignette"></div>
</div></div>
<script>
(function(){
'use strict';
const CP = window.ClassicPlus, K = CP.COLORS;
// Kit tokens: ink is the player, hostile the enemy, signal the player's side, dust collectables.
const C = { ink:K.ink, muted:'#4a4a4a', blue:K.signal, red:K.hostile, orange:K.brickOrange,
  green:K.brickGreen, yellow:K.brickYellow, hard:K.dust, cracked:K.brickCracked, faint:'rgba(245,245,245,0.12)' };

/* ---------- Vector font: the kit's drawVectorText ---------- */
function vtext(c, str, x, y, size, o){
  o = o || {};
  c.save(); if (o.alpha != null) c.globalAlpha *= o.alpha;
  CP.drawVectorText(c, str, x, y, size, { color: o.color || C.ink, align: o.align || 'left', glow: o.glow || 0, lineWidth: o.lw || 2, glowScale: 1 });
  c.restore();
}
// The game's own events go through the shell's live region.
const say = t => { if (shell) shell.say(t); };
const reduced = () => CP.motionReduced();

/* ---------- Game-time timers (pause freezes them) ---------- */
let timers = [];
function later(sec, fn){ timers.push({ t: sec, fn }); }
function runTimers(dt){ if (!timers.length) return; const due = []; for (const t of timers){ t.t -= dt; if (t.t <= 0) due.push(t); } if (due.length){ timers = timers.filter(t => t.t > 0); due.forEach(t => t.fn()); } }

/* ---------- Canvas & layout ---------- */
const wrap = document.getElementById('inner'), cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W=0,H=0,dpr=1, ui=1, cols=0, rows=0, cell=20, fieldLeft=0, fieldTop=0, fieldRight=0, padTop=0, zoneTop=0, HUD_H=56;
let grid = [];
/* Phosphor glow: progressively downsampled copies of the frame, added back on top. */
const GLOW = { tight: 0.42, wide: 0.55 };
const GL = [0,1,2].map(() => { const c = document.createElement('canvas'), x = c.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; return { c, x }; });
function phosphor(){
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  let src = cv;
  for (const g of GL){ g.x.imageSmoothingEnabled = true; g.x.imageSmoothingQuality = 'high'; g.x.globalCompositeOperation = 'copy'; g.x.drawImage(src, 0, 0, g.c.width, g.c.height); src = g.c; }
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = GLOW.tight; ctx.drawImage(GL[1].c, 0, 0, cv.width, cv.height);
  ctx.globalAlpha = GLOW.wide;  ctx.drawImage(GL[2].c, 0, 0, cv.width, cv.height);
  ctx.restore();
}
function layout(){
  const r = wrap.getBoundingClientRect(); W = Math.max(1, r.width); H = Math.max(1, r.height);
  dpr = Math.min(window.devicePixelRatio||1, 2.5);
  ui = Math.max(1, Math.min(2.5, W/400, H/860));   // column layout: phones at 1x, big screens scale up
  HUD_H = Math.round(56*ui);
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  GL.forEach((g,i) => { const f = 2 << i; g.c.width = Math.max(1, Math.round(cv.width/f)); g.c.height = Math.max(1, Math.round(cv.height/f)); });
  if (!cols) cols = 15;   // always the narrow arcade-cabinet field, on every screen
  const padH = Math.max(84, Math.min(140, H*0.15));
  const fieldH = H - HUD_H - padH;
  const sideM = Math.max(18, W*0.05);
  cell = Math.min((W-2*sideM)/cols, fieldH/20);
  const newRows = Math.max(14, Math.floor(fieldH/cell));
  fieldLeft = (W - cols*cell)/2; fieldRight = fieldLeft + cols*cell;
  fieldTop = HUD_H + (fieldH - newRows*cell);
  padTop = fieldTop + newRows*cell;
  if (newRows !== rows){
    const old = grid; rows = newRows; grid = [];
    for (let y=0;y<rows;y++){ grid.push(new Array(cols).fill(null)); }
    for (let y=0;y<Math.min(old.length, rows-1);y++) for (let x=0;x<cols;x++) grid[y][x] = old[y][x];
    for (const w of worms) for (const s of w){ s.r = Math.min(s.r, rows-1); s.pr = Math.min(s.pr, rows-1); }
  }
  zoneTop = rows - 5;
  if (tank) tank.x = clampTankX(tank.x);
}
const cx = c => fieldLeft + (c+0.5)*cell, cy = r => fieldTop + (r+0.5)*cell;
const rand = (a,b) => a + Math.random()*(b-a);
const astAt = (c,r) => (r>=0 && r<rows && c>=0 && c<cols) ? grid[r][c] : null;
function addAst(c,r,force){
  if (r<1||r>=rows-1||c<0||c>=cols||grid[r][c]) return;
  if (!force && worms.some(w => w.some(s => (s.c===c && s.r===r) || (s.pc===c && s.pr===r)))) return;  // never drop a rock onto a worm
  const v=[]; for (let i=0;i<10;i++) v.push(rand(0.7,1));
  grid[r][c] = { hp:4, v, rot:rand(0,6.28), spin:rand(-0.6,0.6) };
}

/* ---------- Audio: the game's own voices, on the kit synth's context, volume and mute ---------- */
const syn = CP.createSynth();
let actx=null;
function ensureAudio(){ syn.unlock(); actx = syn.context(); }
const audible = () => actx && !syn.muted && syn.volume > 0 && actx.state !== 'suspended';
function tone(f1,f2,dur,type,vol){
  if (!audible()) return; const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain(); o.type = type||'square';
  o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(Math.max(0.0001,(vol||0.04)*syn.volume),t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
}
let noiseBuf=null;
function noise(dur,vol,freq){
  if (!audible()) return;
  if (!noiseBuf){ noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const t = actx.currentTime, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type='lowpass'; f.frequency.setValueAtTime(freq||1200,t); f.frequency.exponentialRampToValueAtTime(80,t+dur);
  g.gain.setValueAtTime(Math.max(0.0001,(vol||0.15)*syn.volume),t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(actx.destination); s.start(t); s.stop(t+dur+0.02);
}

/* ---------- Game state ---------- */
let phase='play', score=0, kills=0, lives=3, wave=1, nextLife=20000, lifeStep=25000, time=0;
const LAB = false;
function freshBuffs(){ return {minigun:0,missiles:0,shield:0,wideshot:0,beam:0,clone:0}; }
let beamT=0, beamTick=0, labOn=new Set();
let worms=[], tank=null, bullets=[], missiles=[], explosions=[], pickups=[], fireCd=0, shotCount=0, buffs=freshBuffs(), saucer=null, comets=[], particles=[], popups=[];
const BANNER=1.3, BANNER_OUT=0.4;
let stepTime=0.14, stepAcc=0, stepCount=0, bannerT=0, saucerT=6, reinforceT=0, dieT=0, overT=0, cometCheck=0, bgHue=220, hueDrift=0, saucerSnd=0;

/* ---------- Starfield ---------- */
const stars = [], scope = CP.createScopeGrid({ color: CP.COLORS.gridPhosphor });
(function(){ const layers=[{d:0.06,n:70,sz:1,a:0.35},{d:0.16,n:40,sz:1.5,a:0.55},{d:0.34,n:18,sz:2,a:0.85}];
  layers.forEach((L,li)=>{ for (let i=0;i<L.n;i++) stars.push({ x:Math.random(), y:Math.random(), d:L.d, sz:L.sz, a:L.a*rand(0.6,1),
    layer:li, blue: Math.random()<0.12, tw:rand(0,6.28), tws:rand(1,3) }); }); })();
let shake = 0, rumble = 0;   // camera shake: decaying impulses + a sustained rumble
let parX = 0, bossDark = 0, marchTint = 0, soot = [];
function drawStars(){
  const drift = reduced() ? 0 : time*9, px0 = reduced() ? 0 : parX;
  for (const st of stars){
    const px = (((st.x*W - px0*st.d*2.2) % W) + W) % W;
    const py = (((st.y*H - drift*st.d*3) % H) + H) % H;
    const tw = Math.sin(time*st.tws+st.tw) > 0.85 ? 0.45 : 1;
    ctx.globalAlpha = st.a*tw; const col = st.blue ? C.blue : C.ink;
    ctx.fillStyle=col; ctx.fillRect(Math.round(px), Math.round(py), st.sz, st.sz);
  }
  ctx.globalAlpha=1;
}
function clampTankX(x){ return Math.max(cx(0), Math.min(cx(cols-1), x)); }
function seedAsteroids(){
  for (let y=0;y<rows;y++) grid[y].fill(null);
  const n = Math.floor(cols*rows*0.07);
  for (let i=0;i<n;i++) addAst(Math.floor(Math.random()*cols), 1+Math.floor(Math.random()*(rows-3)));
}
function spawnWorm(n, fromRight){
  const segs=[];
  for (let i=0;i<n;i++){ const c = fromRight ? cols+i : -1-i;
    segs.push({ c, r:0, pc:c, pr:0, dir: fromRight?-1:1, vdir:1 }); }
  worms.push(segs);
}
const UNLOCK_ORDER = ['minigun', 'missiles', 'wideshot', 'beam'];
let unlocked = ['shield'], bannerSub = null, bannerLen = 1.3, bossWins = 0;
// Difficulty tier = boss wins (0 at start). Escalates as buffs unlock.
const tier = () => Math.min(bossWins, 4);
const cyc = () => wave <= 5 ? wave-1 : (wave-6) % 8;  // wave within the current stretch between bosses
function saucerGap(){ const g = [[13,20],[9,15],[6,11],[5,9],[4,7]][tier()]; return rand(g[0], g[1]) * (boss ? 0.45 : 1); }   // saucers swarm during Queen fights
function startWave(){
  bannerSub = null;
  say(isBossWave(wave) && !marchNext ? 'Wave ' + wave + '. The queen.' : 'Wave ' + wave + '.');
  worms=[];
  if (marchNext){ marchNext = false; lastWasMarch = true; startMarch(); return; }
  if (isBossWave(wave)){ lastWasMarch = false; startBoss(); return; }
  // Too many rocks piled up? Send in the marchers to stamp the field flat.
  if (wave >= 3 && !lastWasMarch && countAsteroids() >= marchThreshold()){ lastWasMarch = true; startMarch(); return; }
  lastWasMarch = false; const extra = Math.min(5, Math.floor(cyc()/3) + tier());
  spawnWorm(12-extra, wave%2===0);
  for (let i=0;i<extra;i++){ const c = 1+Math.floor(Math.random()*(cols-2));
    worms.push([{ c, r:0, pc:c, pr:0, dir: Math.random()<0.5?-1:1, vdir:1 }]); }
  stepTime = Math.max(0.07, Math.max(0.085, 0.19 - tier()*0.028) - cyc()*0.004); stepAcc=0; reinforceT=0;
}
function resetGame(){
  unlocked = LAB ? Object.keys(PICKUPS) : ['shield']; bannerSub = null; bossWins = 0;
  score=0; kills=0; lives=3; timers=[]; shake=0; rumble=0; mouseFire=false; bannerWait=false; phase='play'; marchNext=false;
  if (shell) shell.setScore(0); wave=1; nextLife=20000; lifeStep=25000; bossFights=0; pendingDrop=null; particles=[]; popups=[];
  worms=[]; bullets=[]; missiles=[]; explosions=[]; pickups=[]; buffs=freshBuffs(); saucer=null; comets=[]; boss=null; sucked=[]; drift=[]; clone=null; cloneCd=0; march=null; bombs=[]; soot=[]; lastWasMarch=false; saucerT=saucerGap();
  seedAsteroids(); tank = { x:(fieldLeft+fieldRight)/2, vx:0, target:null };
  bannerT=bannerLen=BANNER; phase='play'; stepAcc=0; bannerWait = !!(shell && shell.messagesStay()); inputSeen = false;
}
function addScore(n){ score+=n; if (shell) shell.setScore(score);
  if (score>=nextLife){ lives=Math.min(lives+1,4); nextLife+=lifeStep; lifeStep+=10000; tone(660,1320,0.25,'triangle',0.06);
    popup(tank ? tank.x : W/2, cy(rows-1)-cell*1.6, '+1 LIFE', C.blue); say('Extra life. ' + lives + ' lives.'); } }

/* ---------- Effects ---------- */
function burst(x,y,color,n,spd,g,lifeMul,fr){
  for (let i=0;i<n;i++) particles.push({ x:x+rand(-cell*0.3,cell*0.3), y:y+rand(-cell*0.3,cell*0.3),
    vx:rand(-1,1)*spd, vy:rand(-1,1)*spd, age:0, life:rand(0.6,1.1)*(lifeMul||1), color, size:Math.round(rand(2,5)), g:g||0, fr:fr||0.92 });
}
function popup(x,y,t,color){ popups.push({x,y,t,age:0,color:(!color||color===C.red)?C.yellow:color}); }   // hostile red is too dark for text on the brightest sky

/* ---------- Input ----------
   Keys come through the shell's actions (rebindable, HELD KEYS can make them tap on / tap off).
   Pointer: drag (touch) or hover (mouse) steers. Touch play fires automatically; the mouse button
   fires while down, or toggles fire when HELD KEYS is TAP ON/OFF. */
let shell = null, prevIn = false, mouseFire = false, touchMode = false, bannerWait = false, inputSeen = false;
const ptrs = new Map();
function ptrX(e){ const r = cv.getBoundingClientRect(); return e.clientX - r.left; }
const toggleMode = () => shell && shell.settings.holds === 'toggle';
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); cv.focus({ preventScroll: true });
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  if (!shell || !shell.isPlaying()) return;
  inputSeen = true;
  ptrs.set(e.pointerId, true);
  if (e.pointerType === 'touch' || e.pointerType === 'pen') touchMode = true;
  else { touchMode = false; mouseFire = toggleMode() ? !mouseFire : true; }
  if (tank) tank.target = ptrX(e);
});
cv.addEventListener('pointermove', e => {
  if (!tank || !shell || !shell.isPlaying()) return;
  if (ptrs.has(e.pointerId) || e.pointerType==='mouse') tank.target = ptrX(e);
});
function ptrEnd(e){ ptrs.delete(e.pointerId); if (e.pointerType==='mouse' && !toggleMode()) mouseFire = false;
  if (e.pointerType!=='mouse' && !ptrs.size && tank) tank.target=null; }
cv.addEventListener('pointerup', ptrEnd); cv.addEventListener('pointercancel', ptrEnd);
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', () => { if (shell && shell.isPlaying()) inputSeen = true; });   // keys the shell lets through also release a waiting banner
const firePressed = () => (shell && shell.isDown('fire')) || mouseFire || touchMode;

/* ---------- Update ---------- */
function stepWorms(){
  // Heads steer by the classic rules; every other segment steps into the spot the one ahead just left.
  // Other worm segments count as obstacles, so two heads can never end up stacked in one cell.
  const key = (c,r) => c + ',' + r;
  const occ = new Set(); for (const w of worms) for (const s of w) occ.add(key(s.c, s.r));
  for (const w of worms){
    const old = w.map(s => ({ c:s.c, r:s.r, dir:s.dir, vdir:s.vdir }));
    for (const s of w){ s.pc = s.c; s.pr = s.r; }
    const h = w[0]; let moved = true;
    const inside = h.c>=0 && h.c<cols;
    if (!inside){                                            // off-screen: crawl inward, wait if the entry is taken
      h.dir = h.c<0 ? 1 : -1; const nc = h.c + h.dir;
      if (nc>=0 && nc<cols && occ.has(key(nc, h.r))) moved = false; else h.c = nc;
    } else {
      const nc = h.c + h.dir;
      const blocked = nc<0 || nc>=cols || astAt(nc, h.r) || occ.has(key(nc, h.r));
      if (blocked){
        let nr = h.r + h.vdir;
        if (nr > rows-1){ h.vdir=-1; nr = h.r-1; }
        else if (h.vdir<0 && nr < zoneTop){ h.vdir=1; nr = h.r+1; }
        h.dir = -h.dir;
        if (occ.has(key(h.c, nr))) moved = false;            // another worm is below: just turn around this step
        else {
          if (astAt(h.c, nr)){                               // dropping onto a rock: the worm chews through it
            grid[nr][h.c] = null; burst(cx(h.c), cy(nr), C.ink, 8, cell*4, 0);
            if (phase==='play') noise(0.08, 0.05, 700);
          }
          h.r = nr;
        }
      } else h.c = nc;
    }
    if (moved) for (let i=1;i<w.length;i++){ const o = old[i-1]; w[i].c = o.c; w[i].r = o.r; w[i].dir = o.dir; w[i].vdir = o.vdir; }
    if (moved){ occ.delete(key(old[old.length-1].c, old[old.length-1].r)); occ.add(key(h.c, h.r)); }
  }
  stepCount++;
  if (stepCount%2===0 && worms.length && phase==='play') tone(stepCount%4===0?120:100, 80, 0.06, 'triangle', 0.035);
}
function segPos(s, t){ return [cx(s.pc+(s.c-s.pc)*t), cy(s.pr+(s.r-s.pr)*t)]; }

function killSegment(wi, i, noRock){
  const w = worms[wi], s = w[i], [x,y] = segPos(s, stepAcc/stepTime), head = i===0;
  kills++; addScore(head?100:10); burst(x,y, head?C.red:C.orange, head?30:22, cell*13, 0, 2.3, 0.965);
  noise(0.18, 0.12, head?2000:1400); tone(head?300:220, 60, 0.15, 'square', 0.04);
  if (!noRock && s.c>=0 && s.c<cols && s.r>=1 && s.r<rows-1) addAst(s.c, s.r, true);
  const a = w.slice(0,i), b = w.slice(i+1);
  worms.splice(wi,1); if (a.length) worms.push(a); if (b.length) worms.push(b);
}
/* ---------- Boss: black hole + giant worm ---------- */
const isBossWave = w => w >= 5 && (w-5) % 8 === 0;   // waves 5, 13, 21, ...
let bossFights = 0, pendingDrop = null;
let boss = null, sucked = [];
const holeR = () => cell*3.4;
function bossGrid(){ const BC = cell*2, bCols = Math.floor(cols/2), bRows = Math.floor(rows/2);
  return { BC, bCols, bRows, ox: fieldLeft + (cols*cell - bCols*BC)/2 }; }
function bxy(p){ if (p.hole && boss) return [boss.hx, boss.hy]; const g = bossGrid(); return [g.ox + (p.c+0.5)*g.BC, padTop - (g.bRows - p.r - 0.5)*g.BC]; }
function startBoss(){
  const g = bossGrid(), bc0 = Math.floor(g.bCols/2), ty = fieldTop + rows*cell*0.28;
  const br0 = Math.max(0, Math.round(g.bRows - (padTop-ty)/g.BC - 0.5));
  const hx = (fieldLeft+fieldRight)/2, hy = bxy({c:bc0, r:br0})[1];
  boss = { state:'open', t:0, hx, hy, hr:0, bc0, br0, segs:[], hist:[], dir: Math.random()<0.5?-1:1, vdir:1,
    acc:0, stepT:[0.47,0.42,0.37,0.34,0.32][tier()], steps:0, dropT:2.2, total: 0 };
  boss.holeA = 1;
  boss.rim = []; for (let i=0;i<300;i++) boss.rim.push({ u:Math.random(), sp:rand(0.02,0.07), off: 0.99+Math.pow(Math.random(),2.5)*0.12,
    sz: Math.random()<0.7?2.5:3.5, col: C.red, al: rand(0.45,1),
    w:rand(0.4,1.4), p:rand(0,6.28), amp:rand(0.01,0.05), rth:Math.random() });
  boss.dust = []; for (let i=0;i<260;i++) boss.dust.push({ f:Math.random(), arm:i%5, j:rand(-0.35,0.35), sz: Math.random()<0.6?2.5:4, al: rand(0.45,1), sp:rand(0.03,0.1),
    w1:rand(0.3,1.2), w2:rand(0.3,1.2), p1:rand(0,6.28), p2:rand(0,6.28), amp:rand(0.03,0.12), rth:Math.random() });
  const bh = [6,9,12,14,16][tier()];   // hits per body segment (head takes double)
  const len = Math.min(14, 5 + bossFights*2); bossFights++;
  for (let i=0;i<len;i++) boss.segs.push({ id:i, hp: i===0?bh*2:bh, max: i===0?bh*2:bh, flash:0, ox:0, oy:0, emergeAt:-1, scd:0 });
  boss.total = boss.segs.reduce((n,s)=>n+s.hp,0);
  saucerT = Math.min(saucerT, saucerGap());   // don't make the fight wait out a long pre-boss saucer timer
  tone(90, 25, 1.4, 'sawtooth', 0.06); noise(1.6, 0.12, 400);
}
function bossSegPos(i){
  const b = boss, s = b.segs[i];
  if (s.emergeAt < 0 || !b.hist[i]) return [b.hx + s.ox, b.hy + s.oy];
  const t = Math.min(1, b.acc/b.stepT), cur = b.hist[i], prev = b.hist[i+1] || cur;
  const [x1,y1] = bxy(prev), [x2,y2] = bxy(cur);
  return [x1+(x2-x1)*t + s.ox, y1+(y2-y1)*t + s.oy];
}
function bossStep(){
  const g = bossGrid(), b = boss, h = b.hist[0]; let c = h.c, r = h.r;
  const nc = c + b.dir;
  if (nc<0 || nc>=g.bCols){
    let nr = r + b.vdir;
    if (nr > g.bRows-1){ b.vdir=-1; nr = r-1; } else if (b.vdir<0 && nr < g.bRows-3){ b.vdir=1; nr = r+1; }
    r = nr; b.dir = -b.dir;

      for (let c=c0;c<=c1;c++) for (let r=0;r<rows-1;r++){ const a = astAt(c,r); if (!a) continue;
        a.hp--; burst(cx(c), cy(r), C.cracked, 3, cell*4, 0); if (a.hp<=0){ grid[r][c]=null; addScore(1); } }
      if (boss && boss.state==='fight') for (let i=boss.segs.length-1;i>=0;i--){ if (boss.segs[i].emergeAt<0) continue;
        const [sx,sy]=bossSegPos(i); if (sy < baseY && Math.abs(sx-bx) < half+cell*0.9){ hitBossSeg(i); if (!boss || boss.state!=='fight') break; } }
      for (let k=0;k<2;k++) particles.push({ x:bx+rand(-half,half), y:rand(topY, baseY), vx:rand(-1,1)*cell*3, vy:rand(-1,1)*cell*2, age:0, life:rand(0.2,0.45), color: Math.random()<0.5?C.cracked:C.ink, size:2, g:0 });
    }
  }

  // missiles
  for (let mi=missiles.length-1; mi>=0; mi--){
    const m = missiles[mi];
    m.vy = Math.min(cell*28, m.vy + cell*40*dt); m.y -= m.vy*dt;
    particles.push({ x:m.x+rand(-1.5,1.5), y:m.y+cell*0.45, vx:rand(-8,8), vy:rand(10,30), age:0, life:0.45, color:C.muted, size:3, g:0 });
    const c = Math.floor((m.x-fieldLeft)/cell), r = Math.floor((m.y-fieldTop)/cell), t = stepAcc/stepTime;
    let boom = m.y < fieldTop+cell*0.5 || !!astAt(c,r);
    if (!boom) for (const w of worms) for (const s of w){ const [sx,sy]=segPos(s,t); if (Math.abs(sx-m.x)<cell*0.5 && Math.abs(sy-m.y)<cell*0.5) boom=true; }
    if (!boom && saucer && Math.abs(saucer.x-m.x)<cell*0.85 && Math.abs(saucer.y-m.y)<cell*0.5) boom=true;
    if (!boom && (marcherAt(m.x, m.y, cell*0.5)>=0 || bombAt(m.x, m.y, cell*0.4)>=0)) boom=true;
    if (!boom && comets.some(k => Math.abs(k.x-m.x)<cell*0.5 && Math.abs(k.y-m.y)<cell*0.6)) boom=true;
    if (!boom && boss && boss.state==='fight') boss.segs.forEach((s,i)=>{ if (s.emergeAt>=0){ const [sx,sy]=bossSegPos(i); if (Math.abs(sx-m.x)<cell*0.9 && Math.abs(sy-m.y)<cell*0.9) boom=true; } });
    if (boom){ explosions.push({ x:m.x, y:m.y, age:0, dur:0.9, maxR:cell*1.9 }); missiles.splice(mi,1);
      noise(0.7, 0.25, 900); tone(160, 40, 0.5, 'sawtooth', 0.05); }
  }

  // explosions (missile-command style)
  for (let ei=explosions.length-1; ei>=0; ei--){
    const e = explosions[ei]; e.age += dt; const R = expR(e);
    if (e.age >= e.dur){ explosions.splice(ei,1); continue; }
    if (e.hostile){                                   // enemy bomb blast: craters rocks, hurts the player
      for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) if (grid[r][c] && Math.hypot(cx(c)-e.x, cy(r)-e.y) < R+cell*0.2){ grid[r][c]=null; burst(cx(c),cy(r),C.ink,6,cell*4,0); }
      if (!e.harmless && phase==='play' && tank && !(buffs.shield>0) && !(tank.inv>0) && Math.hypot(tank.x-e.x, cy(rows-1)-e.y) < R+cell*0.45){ killTank(); return; }
      continue;
    }
    if (march){ for (let i=march.units.length-1; i>=0 && march; i--){ const [ux,uy] = marchPos(march.units[i]); if (Math.hypot(ux-e.x, uy-e.y) < R+cell*0.4) killMarcher(i); } }
    for (let bi=bombs.length-1; bi>=0; bi--) if (Math.hypot(bombs[bi].x-e.x, bombs[bi].y-e.y) < R+cell*0.3) defuseBomb(bi);
    const c0 = Math.floor((e.x-R-fieldLeft)/cell), c1 = Math.floor((e.x+R-fieldLeft)/cell);
    const r0 = Math.floor((e.y-R-fieldTop)/cell), r1 = Math.floor((e.y+R-fieldTop)/cell);
    for (let r=r0;r<=r1;r++) for (let c=c0;c<=c1;c++) if (astAt(c,r) && Math.hypot(cx(c)-e.x, cy(r)-e.y) < R+cell*0.2){
      grid[r][c]=null; addScore(1); burst(cx(c),cy(r),C.ink,8,cell*5,0); }
    const t = stepAcc/stepTime; let again = true;
    while (again){ again=false;
      for (let wi=0; wi<worms.length && !again; wi++) for (let i=0;i<worms[wi].length;i++){
        const [sx,sy]=segPos(worms[wi][i],t);
        if (Math.hypot(sx-e.x, sy-e.y) < R+cell*0.3){ killSegment(wi,i,true); again=true; break; } } }
    if (saucer && Math.hypot(saucer.x-e.x, saucer.y-e.y) < R+cell*0.5) killSaucer(saucerPts());
    for (const k of comets.slice()) if (Math.hypot(k.x-e.x, k.y-e.y) < R+cell*0.3) killComet(k);
    if (boss && boss.state==='fight'){ e.hit = e.hit || new Set();
      for (let i=boss.segs.length-1;i>=0;i--){ const s2=boss.segs[i]; if (s2.emergeAt<0 || e.hit.has(s2.id)) continue;
        const [sx,sy]=bossSegPos(i); if (Math.hypot(sx-e.x, sy-e.y) < R+cell*0.8){ e.hit.add(s2.id); hitBossSeg(i); if (!boss || boss.state!=='fight') break; } } }
  }

  // pickups
  for (let pi=pickups.length-1; pi>=0; pi--){
    const p = pickups[pi], floor = cy(rows-1);
    if (p.y < floor){ p.y = Math.min(floor, p.y + cell*3.2*dt); } else p.life -= dt;
    if (Math.abs(p.x-tank.x) < cell*0.95 && Math.abs(p.y-floor) < cell*0.9){
      const info = PICKUPS[p.type]; buffs[p.type] = info.dur;
      popup(p.x, floor-cell, info.name, info.color); burst(p.x, p.y, info.color, 16, cell*5, 0);
      tone(660, 1320, 0.12, 'square', 0.04); later(0.09, ()=>tone(990,1980,0.15,'square',0.035)); say(info.name.toLowerCase() + '.');
      pickups.splice(pi,1); continue; }
    if (p.life <= 0) pickups.splice(pi,1);
  }

  // waves
  stepAcc+=dt; while (stepAcc>=stepTime){ stepAcc-=stepTime; stepWorms(); }
  if (worms.some(w => w[0].r>=zoneTop)){
    reinforceT+=dt;
    if (reinforceT>5 && worms.reduce((n,w)=>n+w.length,0)<20){ reinforceT=0;
      const right = Math.random()<0.5, c = right?cols:-1; worms.push([{c, r:0, pc:c, pr:0, dir:right?-1:1, vdir:1}]); }
  }

  // saucer (the spider)
  if (!saucer){ saucerT-=dt;
    if (saucerT<=0 && bannerT<=0){ const L = Math.random()<0.5;
      const red = Math.random() < (boss ? 0.75 : 0.4);                 // raiders (spiked): a little rarer than the pickup saucers
      const sp = cell*(1.4 + tier()*0.25 + cyc()*0.05) * (red ? 1.6 : 1);
      saucer = { x: L?fieldLeft-cell:fieldRight+cell, y: cy(zoneTop-2), vx:(L?1:-1)*sp, vy:cell*3.5, turn:0.4, red, sp, age:0 }; } }
  else {
    saucer.age += dt;
    saucer.x+=saucer.vx*dt; saucer.y+=saucer.vy*dt;
    const yMin = cy(zoneTop-3), yMax = saucer.red ? cy(rows-1) : cy(rows-2)+cell*0.35;
    if (saucer.y<yMin){ saucer.y=yMin; saucer.vy=Math.abs(saucer.vy); }
    if (saucer.y>yMax){ saucer.y=yMax; saucer.vy=-Math.abs(saucer.vy); }
    saucer.turn-=dt;
    if (saucer.red){
      // twitchy raider: short jerky hops, lunges at the tank, bounces off the walls until it gets bored
      if (saucer.age < 7){
        if (saucer.x < fieldLeft+cell && saucer.vx < 0) saucer.vx = Math.abs(saucer.vx);
        if (saucer.x > fieldRight-cell && saucer.vx > 0) saucer.vx = -Math.abs(saucer.vx);
      }
      if (saucer.turn<=0){ saucer.turn = rand(0.07, 0.24);
        const roll = Math.random();
        if (roll < 0.3 && tank && saucer.age < 7){ saucer.vx = Math.sign(tank.x - saucer.x || 1)*saucer.sp*rand(1.1,1.6); saucer.vy = cell*rand(5,8); }
        else if (roll < 0.5) saucer.vx = -saucer.vx;
        else saucer.vy = (Math.random()<0.5?-1:1)*cell*rand(4,9);
        if (saucer.age >= 7) saucer.vx = Math.sign(saucer.vx || 1)*saucer.sp*1.3;   // bored: dart off-screen
      }
    } else if (saucer.turn<=0){ saucer.turn=rand(0.25,0.8);
      saucer.vy = Math.random()<0.2 ? 0 : (Math.random()<0.5?-1:1)*cell*rand(2.8,5); }
    const c = Math.floor((saucer.x-fieldLeft)/cell), r = Math.floor((saucer.y-fieldTop)/cell);
    if (astAt(c,r) && Math.random()<dt*2.5){ grid[r][c]=null; burst(cx(c),cy(r),C.ink,6,cell*3,0); }
    saucerSnd-=dt; if (saucerSnd<=0){ if (saucer.red){ saucerSnd=0.08; tone(Math.random()<0.5?880:1180, 700, 0.06, 'square', 0.016); } else { saucerSnd=0.16; tone(saucer.x%2<1?520:620, 480, 0.12, 'sine', 0.02); } }
    if (saucer.x<fieldLeft-cell*2 || saucer.x>fieldRight+cell*2){ saucer=null; saucerT=saucerGap(); }
  }

  // boss
  if (boss) updateBoss(dt);
  updateMarch(dt);
  updateClone(dt);

  // comets (the flea)
  cometCheck-=dt;
  if (!comets.length && !boss && !march && cometCheck<=0 && wave>=2 && bannerT<=0){ cometCheck=1;
    let n=0; for (let r=zoneTop;r<rows-1;r++) for (let c=0;c<cols;c++) if (grid[r][c]) n++;
    if (n < 3+Math.min(wave,4) && Math.random()<0.45) spawnComet(cx(Math.floor(Math.random()*cols)), fieldTop-cell); }
  for (const comet of comets.slice()){
    comet.y+=comet.vy*dt; const r = Math.floor((comet.y-fieldTop)/cell);
    { const col = comet.hp>1?C.yellow:C.cracked; let n = dt*90;
      while (n>0){ if (n>=1 || Math.random()<n){
          particles.push({ x:comet.x+rand(-cell*0.22,cell*0.22), y:comet.y-cell*0.3+rand(-3,3),
            vx:rand(-cell*0.6,cell*0.6), vy:rand(-cell*0.8,cell*0.4), age:0, life:rand(0.35,0.9),
            color: Math.random()<0.25?C.ink:col, size: Math.random()<0.7?1.5:2.5, g:0, fr:0.97 }); }
        n-=1; } }
    if (r!==comet.lastR){ comet.lastR=r; if (r>=1 && r<=rows-2 && Math.random()<0.28) addAst(comet.c, r); }
    if (comet.y > padTop+cell) comets = comets.filter(x => x!==comet);
  }

  // tank collisions
  const ty = cy(rows-1), t = stepAcc/stepTime;
  if (tank.inv>0) tank.inv -= dt;
  if (tank.inv>0){ /* respawn grace */ }
  else if (buffs.shield>0){
    const SR = cell*1.15; let again=true;
    while (again){ again=false;
      for (let wi=0; wi<worms.length && !again; wi++) for (let i=0;i<worms[wi].length;i++){
        const [sx,sy] = segPos(worms[wi][i],t);
        if (Math.hypot(sx-tank.x, sy-ty) < SR+cell*0.3){ killSegment(wi,i); again=true; break; } } }
    if (saucer && Math.abs(saucer.x-tank.x)<SR+cell*0.6 && Math.abs(saucer.y-ty)<SR) killSaucer(900);
    for (const k of comets.slice()) if (Math.abs(k.x-tank.x)<SR && Math.abs(k.y-ty)<SR) killComet(k);
    if (boss && boss.state==='fight') for (let i=boss.segs.length-1;i>=0;i--){ const s2=boss.segs[i]; if (s2.emergeAt<0 || s2.scd>0) continue;
      const [sx,sy]=bossSegPos(i); if (Math.hypot(sx-tank.x, sy-ty) < SR+cell*0.8){ s2.scd=0.5; hitBossSeg(i); if (!boss || boss.state!=='fight') break; } }
  } else {
    for (const w of worms) for (const s of w){ const [sx,sy] = segPos(s,t);
      if (Math.hypot(sx-tank.x, sy-ty) < cell*0.8){ killTank(); return; } }
    if (saucer && Math.abs(saucer.x-tank.x)<cell*1.2 && Math.abs(saucer.y-ty)<cell*0.8){ killTank(); return; }
    if (comets.some(k => Math.abs(k.x-tank.x)<cell*0.8 && Math.abs(k.y-ty)<cell*0.6)){ killTank(); return; }
    if (marcherAt(tank.x, ty, cell*0.85) >= 0){ killTank(); return; }
    if (boss && boss.state==='fight') for (let i=0;i<boss.segs.length;i++){ if (boss.segs[i].emergeAt<0) continue;
      const [sx,sy]=bossSegPos(i); if (Math.hypot(sx-tank.x, sy-ty) < cell*1.2){ killTank(); return; } }
  }

  if (bannerT<=0 && !worms.length && !boss && !march && !bombs.length){ beamT=0; wave++; bannerT=bannerLen=(bannerSub?2.6:BANNER); bullets=[]; missiles=[]; explosions=[]; tone(440,880,0.3,'triangle',0.05); later(0.18, ()=>tone(660,1320,0.35,'triangle',0.045)); bannerWait = shell.messagesStay(); inputSeen = false; }
}

/* ---------- Render ---------- */
function poly(pts){ ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.stroke(); }
function drawAsteroid(a, x, y, sc){
  const R = cell*0.57*(0.4+0.6*a.hp/4)*(sc==null?1:sc);
  ctx.beginPath();
  for (let i=0;i<a.v.length;i++){ const ang = a.rot + i/a.v.length*Math.PI*2;
    const px = x+Math.cos(ang)*R*a.v[i], py = y+Math.sin(ang)*R*a.v[i]; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.closePath(); ctx.stroke();
}
function drawSeg(s, x, y, head, idx, sc){
  const R = cell*0.5*(sc||1), col = head?C.red:C.orange, wig = Math.sin(time*16+idx*1.2)*cell*0.1;
  ctx.save(); ctx.translate(x,y); ctx.strokeStyle=col; ctx.lineWidth=1.5;
  ctx.beginPath();
  for (const sg of [-1,1]){ ctx.moveTo(-R*0.35, sg*R*0.75); ctx.lineTo(-R*0.35+wig, sg*R*1.18);
    ctx.moveTo(R*0.35, sg*R*0.75); ctx.lineTo(R*0.35-wig, sg*R*1.18); }
  ctx.stroke(); ctx.lineWidth=2;
  if (!head){
    const o=[]; for (let i=0;i<8;i++){ const a=i/8*Math.PI*2+Math.PI/8; o.push([Math.cos(a)*R*0.85, Math.sin(a)*R*0.85]); }
    poly(o); poly([[0,-R*0.32],[R*0.32,0],[0,R*0.32],[-R*0.32,0]]);
  } else {
    let dx = s.c-s.pc, dy = s.r-s.pr; if (!dx && !dy) dx = s.dir;
    ctx.rotate(Math.atan2(dy,dx));
    poly([[R*0.95,-R*0.45],[R*0.95,R*0.45],[R*0.2,R*0.9],[-R*0.8,R*0.7],[-R*0.8,-R*0.7],[R*0.2,-R*0.9]]);
    const bite = Math.sin(time*12)*R*0.12;
    ctx.beginPath();
    for (const sg of [-1,1]){ ctx.moveTo(R*0.95, sg*R*0.3); ctx.lineTo(R*1.4, sg*(R*0.55-bite)); ctx.lineTo(R*1.25, sg*(R*0.12)); }
    ctx.stroke();
    ctx.fillStyle=C.ink; const e=Math.max(2,R*0.26);
    ctx.fillRect(R*0.25, -R*0.42-e/2, e, e); ctx.fillRect(R*0.25, R*0.42-e/2, e, e);
  }
  ctx.restore();
}
function drawTank(x, y, alpha){
  const w = cell*0.8, c = cell;
  ctx.save(); ctx.translate(x,y); ctx.globalAlpha=alpha; ctx.strokeStyle=C.ink; ctx.lineWidth=2; ctx.lineJoin='miter';
  ctx.strokeRect(-w, c*0.08, w*2, c*0.36);
  ctx.beginPath(); const step = c*0.22, off = ((x % step)+step)%step;
  for (let tx=-w+off; tx<w; tx+=step){ ctx.moveTo(tx, c*0.08); ctx.lineTo(tx, c*0.44); }
  ctx.lineWidth=1; ctx.stroke(); ctx.lineWidth=2;
  poly([[-w*0.85,c*0.08],[-w*0.55,-c*0.22],[w*0.55,-c*0.22],[w*0.85,c*0.08]]);
  ctx.strokeRect(-w*0.3, -c*0.44, w*0.6, c*0.22);
  ctx.beginPath(); ctx.moveTo(0,-c*0.44); ctx.lineTo(0,-c*0.95); ctx.stroke();
  ctx.restore();
}
function drawSaucer(s){
  const S = cell*0.85; ctx.save(); ctx.translate(s.x,s.y); ctx.strokeStyle = C.red; ctx.lineWidth=2;   // both saucers are enemies: hostile; the raider is told apart by its spikes and eye
  if (s.red){                                         // raider: jagged underside spikes and a flickering eye
    // spikes sit on the hull's bottom edge (which runs from -0.45 to +0.45); the outer two grow from its corner vertices
    ctx.beginPath();
    for (const sg of [-1, 1]){ ctx.moveTo(sg*S*0.45, S*0.3); ctx.lineTo(sg*S*0.68, S*0.62); ctx.lineTo(sg*S*0.28, S*0.3); }
    ctx.moveTo(-S*0.1, S*0.3); ctx.lineTo(0, S*0.62); ctx.lineTo(S*0.1, S*0.3);
    ctx.stroke();
    if (Math.floor(time*6)%2){ ctx.fillStyle = C.ink; ctx.fillRect(-S*0.12, -S*0.5, S*0.24, S*0.16); }
  }
  poly([[-S,0],[-S*0.45,-S*0.3],[S*0.45,-S*0.3],[S,0],[S*0.45,S*0.3],[-S*0.45,S*0.3]]);
  ctx.beginPath(); ctx.moveTo(-S,0); ctx.lineTo(S,0);
  ctx.moveTo(-S*0.45,-S*0.3); ctx.lineTo(-S*0.25,-S*0.62); ctx.lineTo(S*0.25,-S*0.62); ctx.lineTo(S*0.45,-S*0.3); ctx.stroke();
  ctx.restore();
}
function drawComet(k){
  const R = cell*0.34, col = k.hp>1?C.yellow:C.cracked;
  ctx.save(); ctx.translate(k.x,k.y); ctx.strokeStyle=col; ctx.lineWidth=2;
  poly([[0,R*1.2],[R,0],[0,-R],[-R,0]]);
  if (k.hp>1) poly([[0,R*0.6],[R*0.5,0],[0,-R*0.5],[-R*0.5,0]]);   // two hits left: a second diamond, not just a colour
  ctx.restore();
}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = `hsl(${bgHue%360},${36-16*bossDark}%,${(12-8*bossDark)/(1+GLOW.tight+GLOW.wide)}%)`; ctx.fillRect(0,0,W,H);
  // scope grid
  if (marchTint > 0.01){ ctx.globalAlpha = marchTint; ctx.fillStyle = `hsl(345,62%,${9/(1+GLOW.tight+GLOW.wide)}%)`; ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1; }
  drawStars();
  { const a = (shell.isPlaying() && !reduced()) ? shake + rumble : 0;   // no shake when paused or under reduced motion
    if (a > 0.05) ctx.translate(rand(-a, a), rand(-a, a)); }
  for (const p of soot){ ctx.globalAlpha = p.al * marchTint; ctx.fillStyle = C.red; ctx.fillRect(Math.round(p.x + Math.sin(time*0.8+p.ph)*p.sw), Math.round(p.y), p.sz, p.sz); }
  ctx.globalAlpha = 1;
  scope.draw(ctx, W, H, W - (tank ? tank.x : W/2));   // the kit's scope grid, drifting opposite the tank

  // field frame + zone ticks
  ctx.strokeStyle=C.faint; ctx.beginPath();
  if (fieldLeft>6){ ctx.moveTo(fieldLeft-0.5, fieldTop); ctx.lineTo(fieldLeft-0.5, padTop); ctx.moveTo(fieldRight+0.5, fieldTop); ctx.lineTo(fieldRight+0.5, padTop); }
  const zy = fieldTop + zoneTop*cell;
  ctx.moveTo(fieldLeft, zy); ctx.lineTo(fieldLeft+cell*0.6, zy); ctx.moveTo(fieldRight, zy); ctx.lineTo(fieldRight-cell*0.6, zy);
  ctx.moveTo(0, padTop+0.5); ctx.lineTo(W, padTop+0.5); ctx.stroke();

  drawDrift();
  if (boss) drawBoss();
  if (clone) drawClone();
  drawMarch();
  // asteroids
  ctx.strokeStyle=C.ink; ctx.lineWidth=1.6; ctx.lineJoin='round';
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){ const a=grid[r][c]; if (a){ ctx.globalAlpha = 0.55+0.45*a.hp/4; drawAsteroid(a, cx(c), cy(r)); } }
  ctx.globalAlpha=1;

  // worms
  const t = Math.min(1, stepAcc/stepTime);
  ctx.save(); ctx.beginPath(); ctx.rect(fieldLeft-cell*0.1, fieldTop-cell, cols*cell+cell*0.2, rows*cell+cell); ctx.clip();
  ctx.strokeStyle=C.orange; ctx.globalAlpha=0.45; ctx.lineWidth=1.5;
  for (const w of worms){ ctx.beginPath();
    for (let i=1;i<w.length;i++){ const [ax,ay]=segPos(w[i-1],t), [bx,by]=segPos(w[i],t);
      if (Math.hypot(ax-bx,ay-by) < cell*1.6){ ctx.moveTo(ax,ay); ctx.lineTo(bx,by); } } ctx.stroke(); }
  ctx.globalAlpha=1; let idx=0;
  for (const w of worms){ const per = w.length+2, pp = (stepCount + t) % per;
    for (let i=w.length-1;i>=0;i--){ const [x,y]=segPos(w[i],t);
      let d = Math.abs(i-pp); d = Math.min(d, per-d);
      drawSeg(w[i], x, y, i===0, idx++, 1 + 0.28*Math.max(0, 1-d)); } }
  ctx.restore();

  for (const k of comets) drawComet(k);
  if (saucer) drawSaucer(saucer);

  // bullets with ghost trail
  { const op=[0.32,0.23,0.15,0.09,0.05], bw=Math.max(2,cell*0.12), bh=cell*0.45;
    for (const b of bullets){
      ctx.fillStyle = b.wide ? C.hard : buffs.minigun>0 ? C.yellow : C.ink; const dx = b.dx||0;
      op.forEach((a,i)=>{ const o=(i+1)*bh*0.8; ctx.globalAlpha=a; ctx.fillRect(b.x-dx*o-bw/2, b.y+o, bw, bh); });
      ctx.globalAlpha=1; ctx.fillRect(b.x-bw/2, b.y, bw, bh); } }
  // missiles
  for (const m of missiles){ const h=cell*0.62, w=Math.max(2.5, cell*0.12);
    ctx.save(); ctx.translate(m.x, m.y); ctx.strokeStyle=C.green; ctx.lineWidth=2; ctx.lineJoin='miter';
    poly([[0,-h],[w,-h*0.55],[w,h*0.55],[-w,h*0.55],[-w,-h*0.55]]);
    ctx.restore(); }
  // explosions: flat fill, colour cycling each frame
  // explosions: flat fill, one steady colour each (no colour strobing): enemy blasts hostile, the player's coin-yellow
  { explosions.forEach((e)=>{ const R=expR(e); if (R<1) return;
      ctx.fillStyle = e.hostile ? C.red : C.yellow; ctx.globalAlpha = 0.85; ctx.beginPath();
      for (let i=0;i<20;i++){ const a=i/20*Math.PI*2; i?ctx.lineTo(e.x+Math.cos(a)*R, e.y+Math.sin(a)*R):ctx.moveTo(e.x+R, e.y); }
      ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1; }); }
  // pickups
  for (const p of pickups){
    if (p.life<2 && Math.floor(time*6)%2) continue;
    const info = PICKUPS[p.type], col = info.color, sz = Math.max(16, cell*0.78);
    if (p.y < cy(rows-1)){ const op=[0.32,0.23,0.15,0.09,0.05]; ctx.fillStyle=col;
      op.forEach((a,i)=>{ ctx.globalAlpha=a; ctx.fillRect(p.x-sz/4, p.y-sz/4-(i+1)*sz*0.4, sz/2, sz/2); }); }
    ctx.globalAlpha=1; ctx.strokeStyle=col; ctx.lineWidth=2; ctx.strokeRect(p.x-sz/2, p.y-sz/2, sz, sz);
    { const ls = Math.max(0.75, sz*0.55/12); vtext(ctx, info.key, p.x, p.y + 6*ls, ls, { color: col, align:'center', lw: 2 }); }   // a letter, never colour alone
    const pulse = sz*0.5 + (time*2%1)*sz*0.6; ctx.strokeStyle=col; ctx.lineWidth=1; ctx.globalAlpha=1-(time*2%1);
    ctx.strokeRect(p.x-pulse, p.y-pulse, pulse*2, pulse*2); ctx.globalAlpha=1; }
  // tank
  if (beamT>0 && tank && phase==='play'){   // steady beam: no flicker
    const bx = tank.x, half = cell*0.24, baseY = cy(rows-1)-cell*0.9, fl = 0, fade = Math.min(1, beamT/0.15, (1-beamT)/0.06+0.2);
    ctx.globalAlpha = (0.5 + fl*0.15)*fade; ctx.fillStyle = C.cracked; ctx.fillRect(bx-half, fieldTop, half*2, baseY-fieldTop);
    ctx.globalAlpha = 0.95*fade; ctx.fillStyle = C.ink; ctx.fillRect(bx-half*0.3, fieldTop, half*0.6, baseY-fieldTop);
    ctx.globalAlpha = 1;
  }
  if (tank && phase!=='dying' && phase!=='over' && phase!=='title' && phase!=='entry'){
    const ty = cy(rows-1);
    if (Math.abs(tank.vx) > cell*2){ const op=[0.32,0.23,0.15,0.09,0.05], stp = tank.vx*0.012;
      op.forEach((a,i)=> drawTank(tank.x - stp*(i+1), ty, a)); }
    if (!(tank.inv>0 && Math.floor(time*6)%2)) drawTank(tank.x, ty, 1);
    { const act = Object.keys(PICKUPS).filter(k => buffs[k]>0), bw=7, gap=6, bh=cell*1.1;
      if (act.length){ const tot = act.length*(bw+gap)-gap;
        let bx = tank.x + cell*1.25; if (bx + tot > W-6) bx = tank.x - cell*1.25 - tot;
        const by = ty + cell*0.44;
        act.forEach((k,i)=>{ const info=PICKUPS[k], x=Math.round(bx+i*(bw+gap)), f=Math.min(1, buffs[k]/info.dur);
          if (buffs[k]<2 && Math.floor(time*6)%2) return;
          ctx.strokeStyle=C.faint; ctx.lineWidth=1; ctx.strokeRect(x-0.5, by-bh-0.5, bw+1, bh+1);
          ctx.fillStyle=info.color; ctx.fillRect(x, by-bh*f, bw, bh*f);
          vtext(ctx, info.key, x + bw/2, by-bh-5, 0.75, { color: info.color, align:'center', lw: 1.5 }); }); } }
    if (buffs.shield>0 && !(buffs.shield<2 && Math.floor(time*6)%2)){
      ctx.strokeStyle=C.blue; ctx.lineWidth=2; const SR=cell*1.15, pts=[];
      for (let i=0;i<6;i++){ const a=time*1.5+i/6*Math.PI*2; pts.push([tank.x+Math.cos(a)*SR, ty-cell*0.2+Math.sin(a)*SR*0.9]); }
      poly(pts); }
  }

  // particles
  for (const p of particles){ const k=p.age/p.life; ctx.globalAlpha = k<0.6?1:Math.max(0,1-(k-0.6)/0.4);
    ctx.fillStyle=p.color; ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size); }
  ctx.globalAlpha=1;
  for (const p of popups) vtext(ctx, p.t, p.x, p.y, 0.8, { color:p.color, align:'center', alpha:1-p.age, lw:1.5 });

  ctx.setTransform(dpr,0,0,dpr,0,0);   // HUD and overlays stay steady
  // HUD: the labelled layout (small dim labels over values), ending where the shell's buttons begin
  drawHudRow();

  // control hint under the field
  { const padMid = padTop + (H-padTop)/2 + 6*ui, sz = 0.75*ui;
    let hint = touchMode ? 'DRAG TO MOVE - FIRE IS AUTOMATIC'
      : shell.keyFor('left') + ' ' + shell.keyFor('right') + ' MOVE - ' + shell.keyFor('fire') + ' FIRE';
    if (!touchMode && toggleMode() && (shell.isDown('fire') || mouseFire)) hint = 'FIRE ON - ' + shell.keyFor('fire') + ' STOPS';
    const lines = CP.wrapVectorText(hint, sz, W - 32);
    lines.forEach((t, i) => vtext(ctx, t, W/2, padMid + (i - (lines.length-1)/2)*16*ui, sz, { color: K.inkMuted, align:'center', lw: 1.3 })); }

  // wave banner
  if (bannerT>0 && phase==='play'){
    const e = bannerLen - bannerT, IN=0.22, OUT=BANNER_OUT, HOLD=bannerLen-IN-OUT;
    const k = reduced() ? 1 : e<IN ? e/IN : e<IN+HOLD ? 1 : Math.max(0, 1-(e-IN-HOLD)/OUT);
    ctx.fillStyle = `rgba(0,0,0,${(bannerSub ? 0.85 : 0.62)*k})`; ctx.fillRect(fieldLeft, fieldTop, fieldRight-fieldLeft, padTop-fieldTop);
    const fw = fieldRight - fieldLeft - 24;
    if (bannerSub){ const bs = Math.max(0.85*ui, Math.min(1.2*ui, fw/CP.inkWidth(bannerSub.text, 1))), rowsT = CP.wrapVectorText(bannerSub.text, bs, fw);
      rowsT.forEach((t,i) => vtext(ctx, t, W/2, fieldTop+rows*cell*0.45 + 44*ui + i*22*ui, bs, { align:'center', lw:1.8, alpha:k, color:bannerSub.color, glow:2 })); }
    if (!isBossWave(wave)) vtext(ctx, 'WAVE '+String(wave).padStart(2,'0'), W/2, fieldTop+rows*cell*0.45, Math.min(2.2*ui, fw/CP.inkWidth('WAVE 00', 1)), { align:'center', glow:3, lw:2.5, alpha:k });
    else vtext(ctx, 'QUEEN', W/2, fieldTop+rows*cell*0.45, Math.min(2.2*ui, fw/CP.inkWidth('QUEEN', 1)), { align:'center', glow:3, lw:2.5, alpha:k, color:C.red });
    if (bannerWait && bannerT <= BANNER_OUT + 0.01) vtext(ctx, 'PRESS ' + shell.keyFor('fire') + ' OR TAP TO GO ON', W/2, fieldTop+rows*cell*0.45 + 100*ui, 0.75*ui, { align:'center', color:K.inkMuted, lw:1.3 });
  }
  phosphor();
}
function drawHudRow(){
  const lx = fieldLeft, ly = 20*ui, vy = 44*ui, ls = 0.75*ui, vs = 1.25*ui;
  const label = (t, x, al) => vtext(ctx, t, x, ly, ls, { color: K.inkMuted, align: al, lw: 1.2 });
  label('SCORE', lx, 'left'); vtext(ctx, String(score).padStart(6,'0'), lx, vy, vs, { align:'left', lw: 2, glow: 2 });
  const right = shell.hudRight(W, ui);
  // On a narrow screen (the touch buttons take more room) the lives row would run into WAVE:
  // WAVE moves left as far as the score allows, then the lives show as one tank and a count.
  const c = 11*ui, w = c*0.8, pitch = 20*ui, gapX = 14*ui, waveW = CP.inkWidth('00', vs);
  const scoreEnd = lx + CP.inkWidth('000000', vs);
  const livesW = k => k > 0 ? 2*w + (k - 1)*pitch : 0;
  let n = Math.max(0, Math.min(lives, 6)), count = false;
  let wx = Math.min(lx + 118*ui, right - livesW(n) - gapX - waveW);
  if (wx < scoreEnd + gapX) { wx = Math.min(lx + 118*ui, Math.max(scoreEnd + gapX, right - livesW(1) - CP.inkWidth('X6', vs) - 4*ui - gapX - waveW)); count = n > 1; }
  label('WAVE', wx, 'left'); vtext(ctx, String(wave).padStart(2,'0'), wx, vy, vs, { align:'left', lw: 2, glow: 2 });
  label('LIVES', right, 'right');
  let tankRight = right;
  if (count) { vtext(ctx, 'X' + n, right, vy, vs, { align:'right', lw: 2, glow: 2 }); tankRight = right - CP.inkWidth('X' + n, vs) - 4*ui; n = 1; }
  ctx.save(); ctx.strokeStyle=C.ink; ctx.lineWidth=1.5*ui; ctx.lineJoin='miter';
  for (let i=0;i<n;i++){ const x = tankRight - w - i*pitch, y = vy - 6*ui;   // tiny tanks: the player's own avatar
    poly([[x-w,y+c*0.44],[x+w,y+c*0.44],[x+w,y+c*0.08],[x+w*0.85,y+c*0.08],[x+w*0.55,y-c*0.22],[x+w*0.3,y-c*0.22],
      [x+w*0.3,y-c*0.44],[x-w*0.3,y-c*0.44],[x-w*0.3,y-c*0.22],[x-w*0.55,y-c*0.22],[x-w*0.85,y+c*0.08],[x-w,y+c*0.08]]);
    ctx.beginPath(); ctx.moveTo(x,y-c*0.44); ctx.lineTo(x,y-c*0.8); ctx.stroke(); }
  ctx.restore();
}

/* ---------- Shell: title, how to play, settings, pause, sound, result ---------- */
// Carry an old best score over once.
try { const old = parseInt(localStorage.getItem('spaceworm-hi')||'0',10);
  if (old > 0 && localStorage.getItem('classicplus:cp-celestipede:best') == null) localStorage.setItem('classicplus:cp-celestipede:best', JSON.stringify(old)); } catch(e){}
// Settings, pause and sound end the HUD row at the field's right edge (the field is the column).
// The kit's row, ending at the field's right edge instead of the 460px column's. On a touch
// screen the glyphs spread, as the kit's own row does, so each hit box is 44 CSS px.
const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
function hudButtons(W_, H_, u){
  const SH = CP.SHELL, bar = SH.bars.column, cap = bar.cap*u, b = SH.button*u, cyb = bar.cy*u;
  const touch = (coarse || touchMode) ? SH.minTouchCss : 0, g = Math.max(SH.buttonGap*u, touch - 0.75*cap);
  const sR = Math.min(W_ - 14*u, fieldRight), sL = sR - 1.25*cap, pR = sL - g, pL = pR - 0.75*cap, gR = pL - g, gL = gR - cap;
  const y = cyb - b/2, m1 = (pR + sL)/2, m2 = (gR + pL)/2, gw = Math.max(b, touch);
  return { mute: { x:m1, y, w: Math.max(sR + SH.inset*u - m1, touch), h:b, cx:(sL+sR)/2, cy:cyb },
    pause: { x:m2, y, w:m1-m2, h:b, cx:(pL+pR)/2, cy:cyb },
    settings: { x:m2-gw, y, w:gw, h:b, cx:(gL+gR)/2, cy:cyb } };
}
shell = CP.createShell({
  id: 'cp-celestipede', canvas: cv, layout: 'column', title: 'CELESTIPEDE',
  howTo: ['SHOOT THE CELESTIPEDE', 'CATCH WHAT THE SAUCERS DROP', 'BEAT THE QUEEN FOR NEW POWERS'],
  actions: [
    { id: 'left',  label: 'MOVE LEFT',  keys: ['arrowleft', 'a'],  hold: true, group: 'move' },
    { id: 'right', label: 'MOVE RIGHT', keys: ['arrowright', 'd'], hold: true, group: 'move' },
    { id: 'fire',  label: 'FIRE (AUTO)', keys: [' '], hold: true },
    { id: 'drag',  label: 'MOVE (TOUCH FIRES)', display: 'DRAG', fixed: true }
  ],
  steering: true, synth: syn, intro: true, buttons: hudButtons,
  onStart: () => { ensureAudio(); resetGame(); },
  onPause: () => { if (!toggleMode()) mouseFire = false; ptrs.clear(); if (tank) tank.target = null; }
});

function frame(now){
  const dt = shell.tick(now);
  if (dt) update(dt);
  render();
  shell.draw(ctx, W, H, ui);
  requestAnimationFrame(frame);
}
window.addEventListener('resize', layout);
layout(); resetGame(); shell.setScore(0);
requestAnimationFrame(frame);
})();
</script>
